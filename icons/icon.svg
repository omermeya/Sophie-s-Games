<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF7"/>
      <stop offset="0.55" stop-color="#D65DDE"/>
      <stop offset="1" stop-color="#FF7EB6"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FFE989"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4ECFF"/>
    </linearGradient>
    <clipPath id="hornClip">
      <path d="M258 172 L338 58 L304 190 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- rainbow arc -->
  <g fill="none" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <path d="M60 400 A196 196 0 0 1 452 400" stroke="#FF6B8B"/>
    <path d="M82 400 A174 174 0 0 1 430 400" stroke="#FFB84D"/>
    <path d="M104 400 A152 152 0 0 1 408 400" stroke="#FFE66B"/>
    <path d="M126 400 A130 130 0 0 1 386 400" stroke="#7FE0A8"/>
    <path d="M148 400 A108 108 0 0 1 364 400" stroke="#6FC3FF"/>
  </g>

  <!-- clouds under the unicorn -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="418" r="40"/>
    <circle cx="150" cy="430" r="34"/>
    <circle cx="60" cy="440" r="30"/>
    <circle cx="416" cy="418" r="40"/>
    <circle cx="362" cy="430" r="34"/>
    <circle cx="452" cy="440" r="30"/>
    <rect x="30" y="430" width="160" height="40" rx="20"/>
    <rect x="322" y="430" width="160" height="40" rx="20"/>
  </g>

  <!-- mane (behind head) -->
  <g>
    <path d="M300 150 C370 140 400 200 392 260 C388 300 400 330 420 350 C370 360 330 330 318 290 Z" fill="#6FC3FF"/>
    <path d="M292 146 C350 130 380 180 374 230 C370 262 378 290 394 310 C350 318 318 290 306 250 Z" fill="#B794F2"/>
    <path d="M270 150 C320 118 360 150 356 196 C354 226 360 248 372 266 C332 270 306 244 296 210 Z" fill="#FF8CC6"/>
    <path d="M246 164 C280 126 330 128 332 166 C334 190 338 206 348 220 C314 222 290 204 282 180 Z" fill="#FFD166"/>
  </g>

  <!-- head + neck -->
  <path d="M206 600
           C204 420 214 380 206 350
           C170 352 136 346 120 322
           C102 296 116 266 146 250
           C168 236 182 214 196 196
           C220 164 262 150 298 162
           C336 176 352 214 348 260
           C344 310 330 360 336 600 Z"
        fill="url(#face)" stroke="#5B3A8C" stroke-width="8" stroke-linejoin="round"/>

  <!-- ear -->
  <path d="M292 168 C300 132 318 116 330 110 C338 132 334 162 318 184 Z"
        fill="#FFFFFF" stroke="#5B3A8C" stroke-width="8" stroke-linejoin="round"/>
  <path d="M302 166 C308 144 318 132 324 128 C328 144 324 162 316 174 Z" fill="#FFB6D9"/>

  <!-- horn -->
  <path d="M258 172 L338 58 L304 190 Z" fill="url(#horn)" stroke="#5B3A8C" stroke-width="8" stroke-linejoin="round"/>
  <g clip-path="url(#hornClip)" stroke="#F29A2E" stroke-width="7" stroke-linecap="round">
    <path d="M250 142 L330 172"/>
    <path d="M266 116 L336 142"/>
    <path d="M284 90 L342 112"/>
  </g>

  <!-- front forelock -->
  <path d="M232 178 C246 150 280 142 300 160 C286 162 272 176 268 196 C256 184 244 180 232 178 Z" fill="#FF8CC6" stroke="#5B3A8C" stroke-width="6" stroke-linejoin="round"/>

  <!-- happy closed eye -->
  <path d="M222 236 C232 252 252 252 262 236" fill="none" stroke="#5B3A8C" stroke-width="9" stroke-linecap="round"/>
  <path d="M226 246 L218 256 M242 252 L240 264 M258 246 L264 256" stroke="#5B3A8C" stroke-width="6" stroke-linecap="round"/>

  <!-- cheek -->
  <ellipse cx="230" cy="290" rx="20" ry="13" fill="#FFA3CF" opacity="0.85"/>

  <!-- nostril + smile -->
  <ellipse cx="142" cy="300" rx="7" ry="5" fill="#5B3A8C"/>
  <path d="M150 326 C164 336 184 334 194 322" fill="none" stroke="#5B3A8C" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M118 120 L128 150 L158 160 L128 170 L118 200 L108 170 L78 160 L108 150 Z"/>
    <path d="M410 150 L416 168 L434 174 L416 180 L410 198 L404 180 L386 174 L404 168 Z"/>
    <path d="M178 84 L182 96 L194 100 L182 104 L178 116 L174 104 L162 100 L174 96 Z"/>
  </g>
  <circle cx="400" cy="92" r="7" fill="#FFE66B"/>
  <circle cx="96" cy="246" r="6" fill="#FFE66B"/>
</svg>
