<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>בלונים</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8FD8FF; touch-action: none;
               font-family: "Arial Hebrew", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #score { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 18px;
           font-size: 2rem; font-weight: 800; color: #2B1845; }
</style>
</head>
<body>
<div id="score">0</div>
<canvas id="c"></canvas>
<script>
  // Example game: pop the balloons before they float away.
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const scoreEl = document.getElementById('score');
  const COLORS = ['#FF5FA2', '#FFC93C', '#4FD1C5', '#A78BFA', '#FB923C'];
  let W, H, dpr, balloons = [], pops = [], score = 0, last = 0, spawnIn = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  function spawn() {
    const r = 28 + Math.random() * 26;
    balloons.push({ x: r + Math.random() * (W - 2 * r), y: H + r, r,
                    v: 60 + Math.random() * 60 + score * 2,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    wob: Math.random() * 6 });
  }

  c.addEventListener('pointerdown', (e) => {
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r * 1.15) {
        balloons.splice(i, 1);
        pops.push({ x: b.x, y: b.y, t: 0, color: b.color });
        score++; scoreEl.textContent = score;
        break;
      }
    }
  });

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    spawnIn -= dt;
    if (spawnIn <= 0) { spawn(); spawnIn = Math.max(0.35, 1.1 - score * 0.02); }
    ctx.clearRect(0, 0, W, H);
    balloons = balloons.filter(b => b.y > -b.r * 3);
    for (const b of balloons) {
      b.y -= b.v * dt; b.wob += dt * 2;
      const x = b.x + Math.sin(b.wob) * 8;
      ctx.strokeStyle = 'rgba(43,24,69,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, b.y + b.r * 1.15); ctx.lineTo(x + Math.sin(b.wob * 1.3) * 6, b.y + b.r * 2.2); ctx.stroke();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(x, b.y, b.r, b.r * 1.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.ellipse(x - b.r * .35, b.y - b.r * .4, b.r * .18, b.r * .28, -.5, 0, Math.PI * 2); ctx.fill();
    }
    pops = pops.filter(p => (p.t += dt) < 0.35);
    for (const p of pops) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4;
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4, r1 = 10 + p.t * 120, r2 = r1 + 12;
        ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * r1, p.y + Math.sin(a) * r1);
        ctx.lineTo(p.x + Math.cos(a) * r2, p.y + Math.sin(a) * r2); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
