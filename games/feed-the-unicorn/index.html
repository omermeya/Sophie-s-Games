<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Feed the Unicorn">
<meta name="theme-color" content="#FDEBF6">
<title>Feed the Unicorn</title>
<!--
  Feed the Unicorn: a gentle adding / taking-away game for a 5-year-old.

  The unicorn is hungry. Each question shows a sum ("3 + 2") as big digits
  AND as little pictures to count. The child drags the magical food with the
  right number into the unicorn's mouth (a simple tap works too).
  Wrong answers never cost anything: the unicorn shakes its head and the
  food bounces back. No timers, no reading needed.

  Everything lives in this one file: no images, fonts, or network calls,
  so it works fully offline inside the games hub.

  Quick map of the code (search for the "=====" headers):
    CONFIG ........ levels, questions per round, answer choices  ← tweak difficulty here
    FOODS ......... the magical foods (SVG drawings)              ← add new foods here
    STORAGE ....... stars and mute setting in localStorage
    SOUND ......... tiny Web Audio synth (no audio files)
    VOICE ......... speechSynthesis wrapper (reads questions aloud)
    MATH .......... making questions and plausible wrong answers
    DRAWING ....... unicorn, counting items, icons (inline SVG)
    PLAY .......... question screen, counting, rainbow meter
    DRAG & FEED ... pointer-event dragging, eating, bouncing back
    CELEBRATION ... flying unicorn, rainbow trail, confetti
    SCREENS ....... start screen, wiring up buttons
-->
<style>
  /* ---------- Palette tokens ---------- */
  :root{
    --pink:#FFC8E1; --pink-d:#F27AB0;
    --lav:#E6DAFF;  --lav-d:#9C7AD6;
    --mint:#C9F5E3; --mint-d:#3FBF8F;
    --sky:#CDEBFF;  --sky-d:#3FA3DC;
    --gold:#FFD35C; --gold-d:#E8A92B;
    --ink:#5B3F86;  --ink-soft:#8C73B3;
    --card:#FFFFFF;
    --food: clamp(104px, min(19vmin, 15vw), 172px);  /* size of each food */
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:var(--font); color:var(--ink);
    background:linear-gradient(165deg,#FFE9F4 0%,#F1E6FF 50%,#DDF1FF 100%);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:none; -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  button{ font:inherit; color:inherit; touch-action:manipulation; cursor:pointer; -webkit-touch-callout:none; }
  svg{ overflow:visible; }

  /* Soft floating background bubbles (purely decorative) */
  .bg-dots{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .bg-dots i{
    position:absolute; border-radius:50%; opacity:.45;
    animation:drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{ to{ transform:translate(18px,-26px) scale(1.08); } }

  /* ---------- Screens ---------- */
  .screen{
    position:fixed; inset:0; display:none; flex-direction:column;
    padding: calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px)
             calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 14px);
  }
  .screen.active{ display:flex; }

  /* Top bar. The left 64px stay empty: the games hub puts its ⌂ button there. */
  .bar{ display:flex; align-items:center; gap:12px; min-height:84px; flex:0 0 auto; }
  .bar-left{ width:56px; flex:0 0 56px; }
  .bar-mid{ flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
  .bar-right{ display:flex; gap:12px; }

  .round-btn{
    width:80px; height:80px; border-radius:50%; border:4px solid #fff; padding:0;
    background:linear-gradient(180deg,#fff,#F3EAFF); color:var(--lav-d);
    display:grid; place-items:center;
    box-shadow:0 5px 0 #D6C4F5, 0 10px 20px rgba(156,122,214,.25);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1), opacity .2s;
  }
  .round-btn:active{ transform:scale(.9); }
  .round-btn svg{ width:40px; height:40px; }
  .round-btn.dim{ opacity:.45; }

  /* ---------- Start screen ---------- */
  .home-main{
    flex:1; min-height:0; display:grid; gap:clamp(10px,2vw,28px); align-items:center;
    grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0,1fr);
    grid-template-areas: "title title" "uni levels";
  }
  .title{
    grid-area:title; margin:0; text-align:center; font-weight:900; letter-spacing:.5px;
    font-size:clamp(30px,5.6vmin,58px); color:var(--pink-d);
    text-shadow:0 3px 0 #fff, 0 6px 14px rgba(242,122,176,.3);
  }
  .home-uni{ grid-area:uni; height:100%; min-height:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .home-uni svg{ width:100%; height:100%; max-height:62vmin; }
  .levels{
    grid-area:levels; display:grid; grid-template-columns:repeat(2, auto); gap:clamp(14px,2.6vmin,28px);
    justify-content:center; align-content:center;
  }
  .level-btn{
    position:relative; width:clamp(130px,23vmin,200px); height:clamp(130px,23vmin,200px);
    border-radius:34px; border:5px solid #fff; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 7px 0 var(--shade), 0 14px 26px rgba(91,63,134,.18);
    background:var(--bg);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1);
    animation:popIn .5s cubic-bezier(.34,1.6,.5,1) backwards;
  }
  .level-btn:active{ transform:scale(.92) translateY(4px); }
  .level-btn .sign{ font-size:clamp(66px,12vmin,104px); font-weight:900; line-height:.9; color:#fff;
    text-shadow:0 4px 0 var(--shade); letter-spacing:-2px; }
  .level-btn .pips{ display:flex; gap:6px; }
  .level-btn .pips svg{ width:clamp(20px,3.4vmin,28px); height:clamp(20px,3.4vmin,28px); }
  .badge{
    position:absolute; top:-14px; right:-14px; min-width:52px; height:52px; padding:0 8px;
    border-radius:26px; background:#fff; display:flex; align-items:center; justify-content:center; gap:2px;
    font-weight:900; font-size:22px; color:var(--gold-d); box-shadow:0 4px 10px rgba(91,63,134,.2);
  }
  .badge svg{ width:26px; height:26px; }
  .badge:empty{ display:none; }

  .star-pill{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:40px;
    padding:8px 22px 8px 14px; font-weight:900; font-size:clamp(28px,4.6vmin,42px); color:var(--gold-d);
    box-shadow:0 5px 0 #F5E0A8, 0 10px 18px rgba(232,169,43,.2);
  }
  .star-pill svg{ width:clamp(40px,6vmin,54px); height:clamp(40px,6vmin,54px); }
  .star-pill.bump{ animation:bump .6s cubic-bezier(.34,1.8,.5,1); }

  /* ---------- Play screen ---------- */
  .stage{
    flex:1; min-height:0; display:grid; gap:12px;
    grid-template-columns: 44fr 56fr; grid-template-rows: minmax(0,1fr) auto;
    grid-template-areas: "uni q" "uni foods";
  }
  .uni-wrap{ grid-area:uni; min-height:0; min-width:0; position:relative; display:flex; align-items:center; justify-content:center; }
  .uni-wrap svg{ width:100%; height:100%; }
  .uni-wrap.away svg{ opacity:0; transition:opacity .3s; }

  .qcard{
    grid-area:q; min-height:0; background:rgba(255,255,255,.92); border-radius:36px;
    border:4px solid #fff; box-shadow:0 8px 0 #EADDFB, 0 14px 30px rgba(156,122,214,.2);
    display:flex; flex-direction:column; align-items:center; padding:10px 14px 14px; position:relative;
  }
  .equation{
    display:flex; align-items:center; justify-content:center; gap:clamp(8px,1.6vmin,18px);
    font-weight:900; font-size:clamp(52px,10vmin,104px); line-height:1.05; flex:0 0 auto;
  }
  .equation .op{ color:var(--pink-d); }
  .equation .eq{ color:var(--ink-soft); }
  .equation .n{ min-width:.6em; text-align:center; }
  .equation .n.a{ color:#D99A16; }   /* first number matches the first group colour  */
  .equation .n.b{ color:#E0569C; }   /* second number matches the second group / the pink crosses */
  .answer-bubble{
    min-width:1.25em; height:1.2em; padding:0 .1em; border-radius:.32em; border:5px dashed #D2BFF2; color:#C2ACE8;
    display:grid; place-items:center; font-size:.9em;
  }
  .answer-bubble.filled{ border:5px solid var(--mint-d); background:var(--mint); color:#2E9A72; animation:bump .6s cubic-bezier(.34,1.8,.5,1); }

  .items{ flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; gap:3%; }
  .group{ display:grid; gap:calc(var(--item) * .14); justify-content:center; align-content:center; }
  .group-op{ font-weight:900; font-size:calc(var(--item) * 1.1); color:var(--pink-d); }
  .item{
    width:var(--item); height:var(--item); position:relative; cursor:pointer;
    animation:popIn .45s cubic-bezier(.34,1.6,.5,1) both;
  }
  .item svg{ width:100%; height:100%; display:block; transition:opacity .5s, filter .5s; }
  .item.wave svg{ animation:hop .5s ease both; }
  .item .cnt{
    position:absolute; inset:0; display:grid; place-items:center;
    font-weight:900; font-size:calc(var(--item) * .5); color:#fff;
    text-shadow:0 0 3px var(--ink), 0 0 3px var(--ink), 0 1px 0 var(--ink);
    animation:popIn .3s cubic-bezier(.34,1.8,.5,1) both; pointer-events:none;
  }
  /* Taken-away items (subtraction): fade and get a soft sparkly cross */
  .item.gone{ cursor:default; }
  .item.gone svg{ opacity:.28; filter:grayscale(.7); }
  .item.gone::before, .item.gone::after{
    content:""; position:absolute; left:-6%; top:46%; width:112%; height:12%;
    border-radius:99px; background:#F27AB0; transform:rotate(45deg) scaleX(0);
    animation:cross .35s ease-out forwards; box-shadow:0 0 6px #fff;
  }
  .item.gone::after{ transform:rotate(-45deg) scaleX(0); animation-name:cross2; animation-delay:.12s; }
  @keyframes cross{ to{ transform:rotate(45deg) scaleX(1); } }
  @keyframes cross2{ to{ transform:rotate(-45deg) scaleX(1); } }
  .empty-group{
    width:calc(var(--item) * 1.3); height:calc(var(--item) * 1.3); border-radius:50%;
    border:4px dashed #D9C8F5;
  }

  .tray{
    grid-area:foods; display:flex; justify-content:space-evenly; align-items:center;
    padding:14px 8px 18px; border-radius:40px; min-height:calc(var(--food) + 36px);
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 28px, rgba(255,214,234,.6) 28px 56px);
    border:4px solid #fff; box-shadow:0 8px 0 #F6D3E6, 0 14px 26px rgba(242,122,176,.18);
  }
  .food{
    width:var(--food); height:var(--food); position:relative; touch-action:none; cursor:grab;
  }
  .food .pop{ width:100%; height:100%; animation:popIn .5s cubic-bezier(.34,1.6,.5,1) both; animation-delay:inherit; }
  .food .float{ width:100%; height:100%; position:relative; animation:float 2.8s ease-in-out infinite alternate; }
  .food:nth-child(2) .float{ animation-delay:-.9s; }
  .food:nth-child(3) .float{ animation-delay:-1.8s; }
  .food svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 6px rgba(91,63,134,.18)); }
  .food .num{
    position:absolute; transform:translate(-50%,-50%); width:48%; aspect-ratio:1; border-radius:50%;
    background:rgba(255,255,255,.95); border:4px solid #F3E8FF; display:grid; place-items:center;
    font-weight:900; font-size:calc(var(--food) * .33); line-height:1; color:var(--ink); letter-spacing:-1px;
    box-shadow:0 2px 6px rgba(91,63,134,.15);
  }
  .food .num.two{ font-size:calc(var(--food) * .27); }
  .food.dragging{ z-index:50; cursor:grabbing; }
  .food.dragging .float{ animation:none; }
  .food.tried{ opacity:.5; }
  .food.tried .float{ animation-duration:4s; }
  .food.eaten{ visibility:hidden; }
  .food.leave .pop{ animation:popOut .3s ease-in both; animation-delay:0s; }

  /* Rainbow progress meter */
  .meter{ width:clamp(150px,22vmin,210px); height:auto; }
  .meter .band-bg{ fill:none; stroke:#EEE6F7; stroke-linecap:round; }
  .meter .band{ fill:none; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.4,1); }
  .meter.glow{ animation:bump .7s cubic-bezier(.34,1.8,.5,1); }

  /* ---------- Unicorn animations ---------- */
  .u-all{ animation:bob 3.2s ease-in-out infinite alternate; }
  .u-wig{ transform-origin:150px 320px; }
  .u-head{ transform-origin:150px 225px; }
  .u-mane{ transform-origin:150px 110px; animation:sway 3.6s ease-in-out infinite alternate; }
  .u-tail{ transform-origin:215px 290px; animation:sway 2.8s ease-in-out infinite alternate-reverse; }
  .u-eyes{ transform-origin:150px 148px; animation:blink 4.8s infinite; }
  .u-eyes-happy, .u-mouth-open, .u-wings{ display:none; }
  .u-sparkle{ transform-origin:178px 40px; animation:twinkle 2.4s ease-in-out infinite; }
  .unicorn.aah .u-mouth-open{ display:inline; }
  .unicorn.aah .u-mouth-closed{ display:none; }
  .unicorn.happy .u-eyes{ display:none; }
  .unicorn.happy .u-eyes-happy{ display:inline; }
  .unicorn.chomp .u-mouth-open{ display:inline; animation:chompA .3s steps(1) 3; opacity:0; }
  .unicorn.chomp .u-mouth-closed{ animation:chompB .3s steps(1) 3; }
  .unicorn.chomp .u-head{ animation:munch .3s ease-in-out 3; }
  .unicorn.wiggle .u-wig{ animation:wiggle .9s ease-in-out; }
  .unicorn.shake .u-head{ animation:shake .7s ease-in-out; }
  .unicorn.flying .u-wings{ display:inline; }
  .unicorn.flying .u-wing-l{ transform-origin:100px 255px; animation:flapL .35s ease-in-out infinite alternate; }
  .unicorn.flying .u-wing-r{ transform-origin:200px 255px; animation:flapR .35s ease-in-out infinite alternate; }

  @keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-6px); } }
  @keyframes sway{ from{ transform:rotate(-2.5deg); } to{ transform:rotate(2.5deg); } }
  @keyframes blink{ 0%,93%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.08); } }
  @keyframes twinkle{ 0%,100%{ transform:scale(.4) rotate(0); opacity:.2; } 50%{ transform:scale(1) rotate(45deg); opacity:1; } }
  @keyframes chompA{ 0%{ opacity:1; } 50%{ opacity:0; } }
  @keyframes chompB{ 0%{ opacity:0; } 50%{ opacity:1; } }
  @keyframes munch{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.04,.96); } }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0); } 20%{ transform:rotate(-5deg); } 40%{ transform:rotate(5deg); }
                     60%{ transform:rotate(-4deg) translateY(-8px); } 80%{ transform:rotate(3deg); } }
  @keyframes shake{ 0%,100%{ transform:rotate(0); } 15%{ transform:rotate(-9deg); } 35%{ transform:rotate(9deg); }
                    55%{ transform:rotate(-7deg); } 75%{ transform:rotate(5deg); } }
  @keyframes flapL{ from{ transform:rotate(12deg); } to{ transform:rotate(-22deg); } }
  @keyframes flapR{ from{ transform:rotate(-12deg); } to{ transform:rotate(22deg); } }
  @keyframes float{ from{ transform:translateY(0) rotate(-2deg); } to{ transform:translateY(-8px) rotate(2deg); } }
  @keyframes popIn{ from{ transform:scale(.2); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes popOut{ to{ transform:scale(.2); opacity:0; } }
  @keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  @keyframes hop{ 0%,100%{ transform:translateY(0) scale(1); } 45%{ transform:translateY(-28%) scale(1.15); } }

  /* ---------- Effects layer (hearts, sparkles, crumbs) ---------- */
  #fx{ position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
  .particle{ position:absolute; left:0; top:0; will-change:transform, opacity; }
  .particle svg{ width:100%; height:100%; display:block; }

  /* ---------- Celebration ---------- */
  #party{ position:fixed; inset:0; z-index:90; display:none; }
  #party.on{ display:block; }
  #confetti{ position:absolute; inset:0; width:100%; height:100%; }
  #flyer{ position:absolute; left:0; top:0; width:clamp(160px,30vmin,260px); height:clamp(176px,33vmin,286px); will-change:transform; }
  #flyer svg{ width:100%; height:100%; }
  .party-panel{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(16px,3vmin,30px); background:rgba(255,240,250,.82);
  }
  .party-panel.on{ display:flex; animation:fadeIn .4s ease both; }
  @keyframes fadeIn{ from{ opacity:0; } }
  .big-star{ width:clamp(150px,26vmin,230px); height:clamp(150px,26vmin,230px); animation:starIn 1s cubic-bezier(.34,1.6,.5,1) both; }
  @keyframes starIn{ 0%{ transform:scale(0) rotate(-180deg); } 100%{ transform:scale(1) rotate(0); } }
  .big-star svg{ width:100%; height:100%; animation:twinkleBig 2s ease-in-out .9s infinite alternate; }
  @keyframes twinkleBig{ to{ transform:scale(1.08) rotate(8deg); } }
  .party-buttons{ display:flex; gap:clamp(24px,5vmin,56px); }
  .big-btn{
    width:clamp(110px,18vmin,150px); height:clamp(110px,18vmin,150px); border-radius:50%; border:6px solid #fff; padding:0;
    display:grid; place-items:center; background:var(--bg); color:#fff;
    box-shadow:0 7px 0 var(--shade), 0 14px 26px rgba(91,63,134,.25);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1);
    animation:popIn .5s cubic-bezier(.34,1.6,.5,1) backwards;
  }
  .big-btn:active{ transform:scale(.9); }
  .big-btn svg{ width:52%; height:52%; }

  /* ---------- Portrait: stack everything ---------- */
  @media (orientation: portrait){
    .home-main{ grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"title" "uni" "levels"; }
    .home-uni svg{ max-height:44vh; }
    .stage{
      grid-template-columns:1fr; grid-template-rows:clamp(200px,33vh,360px) minmax(0,1fr) auto;
      grid-template-areas:"q" "uni" "foods";
    }
    :root{ --food: clamp(104px, min(19vmin, 26vw), 172px); }
  }
  /* Short landscape screens (phones): shrink the bar a little */
  @media (max-height: 520px){
    .bar{ min-height:72px; }
    .title{ display:none; }
    .home-main{ grid-template-areas:"uni levels" "uni levels"; }
  }
  @media (prefers-reduced-motion: reduce){
    .u-all, .u-mane, .u-tail, .food .float, .bg-dots i{ animation:none; }
  }
</style>
</head>
<body>

<div class="bg-dots" id="bgDots"></div>

<!-- ================= START SCREEN ================= -->
<section id="home" class="screen active">
  <div class="bar">
    <div class="bar-left"></div>
    <div class="bar-mid"><div class="star-pill" id="starPill" aria-label="Stars"></div></div>
    <div class="bar-right"><button class="round-btn mute-btn" aria-label="Sound on or off"></button></div>
  </div>
  <div class="home-main">
    <h1 class="title">Feed the Unicorn</h1>
    <div class="home-uni" id="homeUni" aria-label="Unicorn friend"></div>
    <div class="levels" id="levels"></div>
  </div>
</section>

<!-- ================= PLAY SCREEN ================= -->
<section id="play" class="screen">
  <div class="bar">
    <div class="bar-left"></div>
    <div class="bar-mid"><svg class="meter" id="meter" viewBox="-8 -8 216 118" aria-label="Rainbow progress"></svg></div>
    <div class="bar-right">
      <button class="round-btn" id="sayBtn" aria-label="Hear the question again"></button>
      <button class="round-btn mute-btn" aria-label="Sound on or off"></button>
      <button class="round-btn" id="playHomeBtn" aria-label="Back to start"></button>
    </div>
  </div>
  <div class="stage">
    <div class="uni-wrap" id="playUni"></div>
    <div class="qcard">
      <div class="equation" id="equation"></div>
      <div class="items" id="items"></div>
    </div>
    <div class="tray" id="tray"></div>
  </div>
</section>

<!-- ================= CELEBRATION ================= -->
<div id="party">
  <canvas id="confetti"></canvas>
  <div id="flyer"></div>
  <div class="party-panel" id="partyPanel">
    <div class="big-star" id="bigStar"></div>
    <div class="party-buttons">
      <button class="big-btn" id="againBtn" aria-label="Play again" style="--bg:linear-gradient(180deg,#8EE6C2,#3FBF8F);--shade:#2E9A72"></button>
      <button class="big-btn" id="homeBtn" aria-label="Home" style="--bg:linear-gradient(180deg,#FFA9D0,#F27AB0);--shade:#D45A93"></button>
    </div>
  </div>
</div>

<div id="fx"></div>

<script>
'use strict';

/* =====================================================================
   CONFIG: tweak difficulty here.
   ===================================================================== */
const QUESTIONS_PER_ROUND = 5;   // correct answers needed to fill the rainbow
const ANSWER_CHOICES = 3;        // how many foods to choose from
const WRONG_SPREAD = 3;          // wrong answers are within ±1..WRONG_SPREAD of the right one
const ZERO_CHANCE = 0.1;         // how often a 0 may appear in a question (0 = never, 1 = freely)

// Each level: which operations, and limits.
//   maxSum ......... largest allowed answer for "+" questions
//   bigSumChance ... chance an addition question must have an answer above 10
//   sign / colours . how the start-screen button looks (no reading needed)
const LEVELS = [
  { id:'easy',   ops:['+'],      maxSum:10, bigSumChance:0,   pips:1, sign:'+',
    bg:'linear-gradient(180deg,#9DEBCB,#4CC99A)', shade:'#2E9A72', intro:"Let's add!" },
  { id:'medium', ops:['+'],      maxSum:18, bigSumChance:0.6, pips:2, sign:'+',

function starPath(cx, cy, R, r, n = 5, rot = -90){
  let d = '';
  for (let i = 0; i < n * 2; i++){
    const a = (rot + i * 180 / n) * Math.PI / 180, rr = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}

  return { muted: !!s.muted, stars: (s.stars && typeof s.stars === 'object') ? s.stars : {} };
})();

const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
// Web Animations helper: runs keyframes, keeps the final frame as inline style.
function tween(el, frames, opts){
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      const last = frames[frames.length - 1];
      for (const k in last) if (k !== 'offset' && k !== 'easing') el.style[k] = last[k];
      try { anim && anim.cancel(); } catch (e) {}
      resolve();
    };
    let anim = null;
    try { anim = el.animate(frames, Object.assign({ fill:'forwards' }, opts)); anim.onfinish = finish; anim.oncancel = finish; }
    catch (e) { finish(); return; }
    setTimeout(finish, (opts.duration || 0) + (opts.delay || 0) + 400); // safety net
  });
}

/* =====================================================================
   SOUND: small synthesized effects with the Web Audio API.
   ===================================================================== */
const Sound = {
  ctx: null, noise: null,
  // iOS only allows audio after a touch, so this runs on every tap.
  unlock(){
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource();
        s.buffer = b; s.connect(this.ctx.destination); s.start(0);
        // white noise for the crunchy chomp
        const len = Math.floor(this.ctx.sampleRate * 0.3);
        this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  // One soft note. `at` is seconds from now.
  note(freq, at, dur, { type = 'sine', vol = 0.18, glide = 0 } = {}){
    if (store.muted || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + at;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  },
  crunch(at, vol = 0.35){
    if (store.muted || !this.ctx || !this.noise) return;
    try {
      const t = this.ctx.currentTime + at;
      const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.8;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(f); f.connect(g); g.connect(this.ctx.destination);
      s.start(t); s.stop(t + 0.12);
    } catch (e) {}
  },
  tap(){ this.note(660, 0, 0.12, { type: 'triangle', vol: 0.12 }); },
  pop(){ this.note(520, 0, 0.1, { type: 'sine', vol: 0.14, glide: 880 }); },
  chomp(){ [0, 0.3, 0.6].forEach(t => { this.crunch(t); this.note(150, t, 0.1, { type: 'sine', vol: 0.2, glide: 80 }); }); },
  chime(){ [1568, 1976, 2349, 2637, 3136].forEach((f, i) => this.note(f, i * 0.07, 0.4, { vol: 0.07 }));
           [523, 659, 784].forEach((f, i) => this.note(f, i * 0.08, 0.35, { type: 'triangle', vol: 0.12 })); },
  // A gentle "mm-mm" (no sad sound): two soft notes, like a shake of the head.
  nope(){ this.note(392, 0, 0.18, { type: 'sine', vol: 0.12 }); this.note(330, 0.2, 0.22, { type: 'sine', vol: 0.11 }); },
  boing(){ this.note(260, 0, 0.3, { type: 'triangle', vol: 0.1, glide: 520 }); },
  // Counting notes climb a happy pentatonic scale.
  count(n){ const s = [523, 587, 659, 784, 880]; const f = s[(n - 1) % 5] * Math.pow(2, Math.floor((n - 1) / 5)); this.note(Math.min(f, 3000), 0, 0.25, { type: 'triangle', vol: 0.13 }); },
  giggle(){ [880, 988, 880, 1175].forEach((f, i) => this.note(f, i * 0.09, 0.12, { type: 'triangle', vol: 0.1 })); },
  sparkle(){ this.note(2093 + rand(500), 0, 0.3, { vol: 0.05 }); },
  star(){ [1047, 1319, 1568, 2093].forEach((f, i) => this.note(f, i * 0.1, 0.5, { type: 'triangle', vol: 0.12 })); },
  celebrate(){
    const mel = [[523,0],[659,.16],[784,.32],[1047,.48],[880,.72],[1047,.88],[1175,1.04],[1319,1.24],
                 [1175,1.56],[1319,1.72],[1568,1.9],[2093,2.2]];
    mel.forEach(([f, t]) => this.note(f, t, 0.34, { type: 'triangle', vol: 0.14 }));
    [[262,0],[330,.48],[392,.88],[349,1.24],[392,1.56],[523,1.9]].forEach(([f, t]) => this.note(f, t, 0.5, { type: 'sine', vol: 0.1 }));
    [0.3, 0.8, 1.3, 1.8, 2.3].forEach(t => this.note(2093 + rand(800), t, 0.25, { vol: 0.04 }));
  },
};

/* =====================================================================
   VOICE: reads questions aloud with the built-in speechSynthesis
   (works offline on iPad). If it's missing, the game still works.
   ===================================================================== */
const Voice = {
  voice: null, token: 0,
  ok: () => 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  choose(){
    try {
      const vs = this.ok() ? speechSynthesis.getVoices() : [];
      const en = vs.filter(v => /^en[-_]/i.test(v.lang) || v.lang === 'en');
      this.voice = en.find(v => /samantha|karen|moira|tessa|serena|female/i.test(v.name) && v.localService !== false)
        || en.find(v => /en[-_]US/i.test(v.lang) && v.localService !== false)
        || en[0] || null;
    } catch (e) { this.voice = null; }
  },
  // Speak `text`. Returns a promise that resolves when speech ends
  // (or right away when muted / unsupported, or after a safety timeout).
  say(text){
    const my = ++this.token;
    return new Promise(resolve => {
      if (store.muted || !this.ok()) return resolve();
      let done = false;
      const end = () => { if (!done){ done = true; resolve(); } };
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.lang = this.voice ? this.voice.lang : 'en-US';
        u.rate = 0.82; u.pitch = 1.2; u.volume = 1;   // slow and friendly
        u.onend = end; u.onerror = end;
        speechSynthesis.speak(u);
        setTimeout(end, 900 + text.length * 110);    // never wait forever
      } catch (e) { end(); }
    }).then(() => my === this.token);
  },
  stop(){ this.token++; try { if (this.ok()) speechSynthesis.cancel(); } catch (e) {} },
};
if (Voice.ok()){
  Voice.choose();
  try { speechSynthesis.addEventListener('voiceschanged', () => Voice.choose()); } catch (e) {}
}

const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
               'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const word = (n) => WORDS[n] || String(n);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const spokenQuestion = (q) => `${cap(word(q.a))} ${q.op === '+' ? 'plus' : 'minus'} ${word(q.b)}!`;

/* =====================================================================
   MATH: questions and plausible wrong answers.
   ===================================================================== */
let lastKey = '';
function makeQuestion(level){
  for (let tries = 0; tries < 500; tries++){
    const op = pick(level.ops);
    const a = rand(10), b = rand(10);                 // one digit each: 0..9
    if ((a === 0 || b === 0) && Math.random() > ZERO_CHANCE) continue;
    if (op === '+'){
      if (a + b > level.maxSum) continue;
      if (level.bigSumChance && Math.random() < level.bigSumChance && a + b <= 10) continue;
    } else if (a < b) continue;                       // never negative
    const key = a + op + b;
    if (key === lastKey) continue;                    // no immediate repeats
    lastKey = key;
    return { a, b, op, answer: op === '+' ? a + b : a - b, max: op === '+' ? 18 : 9 };
  }
  return { a: 2, b: 1, op: '+', answer: 3, max: 18 };
}
// Right answer + wrong ones within ±1..WRONG_SPREAD, never negative, never repeated.
function makeChoices(q){
  const near = [];
  for (let d = 1; d <= WRONG_SPREAD; d++){
    for (const v of [q.answer - d, q.answer + d]) if (v >= 0 && v <= q.max) near.push({ v, w: WRONG_SPREAD + 1 - d });
  }
  const wrong = [];
  while (wrong.length < ANSWER_CHOICES - 1 && near.length){
    // closer numbers are a bit more likely (they're the tempting mistakes)
    let r = Math.random() * near.reduce((s, n) => s + n.w, 0), i = 0;
    while (r > near[i].w){ r -= near[i].w; i++; }
    wrong.push(near.splice(i, 1)[0].v);
  }
  return shuffle([q.answer, ...wrong]);
}

// Small counting pictures (40 x 40). Each has two colours for the two groups.
const ITEM_SHAPES = {

  flower: (f, s) => [0, 72, 144, 216, 288].map(r => `<ellipse cx="20" cy="10" rx="7" ry="9" fill="${f}" stroke="${s}" stroke-width="2" transform="rotate(${r} 20 20)"/>`).join('') + `<circle cx="20" cy="20" r="6" fill="#FFE08A" stroke="#F0B93A" stroke-width="2"/>`,

const GROUP_COLOURS = [['#FFD35C', '#E3A520'], ['#FF9EC8', '#E0569C']];

};
const sparkleSVG = (fill) => `<svg viewBox="-12 -12 24 24">${sparkle4(0, 0, 11, fill)}</svg>`;

/* =====================================================================
   EFFECTS: hearts, sparkles and crumbs that burst from a point.
   ===================================================================== */
function burst(x, y, kind, count, spread = 1){
  const fx = $('fx');
  for (let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.className = 'particle';
    let size, html, dx, dy, dur;
    if (kind === 'heart'){
      size = 26 + rand(26); html = ICONS.heart;
      dx = (Math.random() - 0.5) * 220 * spread; dy = -120 - rand(160) * spread; dur = 1100 + rand(600);
    } else if (kind === 'crumb'){
      size = 8 + rand(8); html = `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="${pick(['#F6C77A','#FFB3D9','#FFE08A','#C9B3FF'])}"/></svg>`;
      dx = (Math.random() - 0.5) * 160; dy = 40 + rand(80); dur = 600 + rand(300);
    } else {
      size = 18 + rand(22); html = sparkleSVG(pick(['#FFE08A', '#fff', '#C9B3FF', '#A8EED3', '#FFB3D9']));
      const a = Math.random() * Math.PI * 2, r = (70 + rand(110)) * spread;
      dx = Math.cos(a) * r; dy = Math.sin(a) * r; dur = 700 + rand(500);
    }
    el.style.width = el.style.height = size + 'px';
    el.innerHTML = html;
    fx.appendChild(el);
    const x0 = x - size / 2, y0 = y - size / 2;
    const spin = (Math.random() - 0.5) * 120;
    const a = el.animate([
      { transform: `translate(${x0}px,${y0}px) scale(.3) rotate(0)`, opacity: 1 },
      { transform: `translate(${x0 + dx * .6}px,${y0 + dy * .6}px) scale(1.1) rotate(${spin / 2}deg)`, opacity: 1, offset: .55 },
      { transform: `translate(${x0 + dx}px,${y0 + dy}px) scale(.7) rotate(${spin}deg)`, opacity: 0 },
    ], { duration: dur, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
    const rm = () => el.remove();
    a.onfinish = rm; setTimeout(rm, dur + 300);
  }
}
const centerOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

/* =====================================================================
   PLAY: question screen, counting pictures, rainbow meter.
   ===================================================================== */
const game = {
  level: null, q: null, correct: 0, busy: false, counted: 0, shape: 'star',
};
let playUnicorn = null;   // the <svg> of the unicorn on the play screen

// Rainbow meter: one band per question, outermost first.
const RAINBOW = ['#FF9AA8', '#FFC48A', '#FFE58A', '#9FE6B8', '#8FCBFF', '#C2A8FF', '#F2A8E6'];
function buildMeter(){
  const n = QUESTIONS_PER_ROUND, w = 12, gap = 2, outer = 92;
  let bg = '', fg = '';
  for (let i = 0; i < n; i++){
    const r = outer - i * (w + gap);
    if (r < 14) break;
    const d = `M${100 - r},100 A${r},${r} 0 0 1 ${100 + r},100`;
    const len = (Math.PI * r).toFixed(1);
    bg += `<path class="band-bg" d="${d}" stroke-width="${w}"/>`;
    fg += `<path class="band" data-i="${i}" d="${d}" stroke="${RAINBOW[i % RAINBOW.length]}" stroke-width="${w}" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-len="${len}"/>`;
  }
  const cloud = (x) => `<g fill="#fff" stroke="#E6DAFF" stroke-width="2"><circle cx="${x - 9}" cy="102" r="10"/><circle cx="${x + 9}" cy="102" r="10"/><circle cx="${x}" cy="94" r="12"/></g>`;
  $('meter').innerHTML = bg + fg + cloud(8) + cloud(192);
}
function setMeter(n){
  $('meter').querySelectorAll('.band').forEach(p => {
    p.style.strokeDashoffset = (+p.dataset.i < n) ? '0' : p.dataset.len;
  });
}

function renderQuestion(){
  const q = game.q;
  $('equation').innerHTML =
    `<span class="n a">${q.a}</span><span class="op">${q.op === '+' ? '+' : '−'}</span>` +
    `<span class="n b">${q.b}</span><span class="eq">=</span>` +
    `<span class="answer-bubble" id="answerBubble">?</span>`;

  // Pictures: addition = two groups (gold + pink); subtraction = one group
  // where the last `b` items get taken away.
  game.shape = pick(Object.keys(ITEM_SHAPES));
  game.counted = 0;
  const shape = ITEM_SHAPES[game.shape];
  const itemHTML = (col, i, gone) =>
    `<div class="item${gone ? ' will-go' : ''}" data-i="${i}" style="animation-delay:${i * 40}ms"><svg viewBox="0 0 40 40">${shape(col[0], col[1])}</svg></div>`;
  const group = (n, col, goneFrom = Infinity, start = 0) => {
    if (n === 0) return `<div class="empty-group"></div>`;
    let h = '';
    for (let i = 0; i < n; i++) h += itemHTML(col, start + i, i >= goneFrom);
    return `<div class="group" style="grid-template-columns:repeat(${Math.min(n, 5)}, var(--item))">${h}</div>`;
  };
  let html;
  if (q.op === '+') html = group(q.a, GROUP_COLOURS[0]) + `<div class="group-op">+</div>` + group(q.b, GROUP_COLOURS[1], Infinity, q.a);
  else html = group(q.a, GROUP_COLOURS[0], q.a - q.b);
  $('items').innerHTML = html;
  $('items').querySelectorAll('.item').forEach(el => el.addEventListener('pointerup', onItemTap));
  layoutItems();

  // Subtraction: the taken-away items fade and get a sparkly cross, one by one.
  if (q.op === '-'){
    const goners = [...$('items').querySelectorAll('.item.will-go')].reverse();
    goners.forEach((el, k) => setTimeout(() => {
      if (!el.isConnected) return;
      el.classList.add('gone');
      const c = centerOf(el); burst(c.x, c.y, 'sparkle', 4, 0.35); Sound.sparkle();
    }, 900 + k * 380));
  }
}

// Pick an item size that fits the question card.
function layoutItems(){
  const box = $('items'), q = game.q;
  if (!q || !box.clientWidth) return;
  const colsOf = (n) => n === 0 ? 1.3 : Math.min(n, 5);
  const rowsOf = (n) => n === 0 ? 1.3 : Math.ceil(n / 5);
  let cols, rows;
  if (q.op === '+'){ cols = colsOf(q.a) + colsOf(q.b) + 1.6; rows = Math.max(rowsOf(q.a), rowsOf(q.b)); }
  else { cols = colsOf(q.a); rows = rowsOf(q.a); }
  const w = box.clientWidth * 0.92 / (cols * 1.16), h = box.clientHeight * 0.9 / (rows * 1.16);
  const size = Math.max(22, Math.min(96, Math.floor(Math.min(w, h))));
  box.style.setProperty('--item', size + 'px');
}

// Tap the pictures to count them together: each tap shows and says the next number.
function onItemTap(e){
  const el = e.currentTarget;
  Sound.unlock();
  // taken-away pictures don't count; they just wobble
  if (el.classList.contains('will-go')) { el.classList.remove('wave'); void el.offsetWidth; el.classList.add('wave'); return; }
  const countable = [...$('items').querySelectorAll('.item:not(.will-go)')];
  if (el.querySelector('.cnt')){
    // everything counted already? start again from one
    if (countable.every(i => i.querySelector('.cnt'))){
      countable.forEach(i => { const c = i.querySelector('.cnt'); if (c) c.remove(); });
      game.counted = 0;
    } else return;
  }
  game.counted++;
  el.insertAdjacentHTML('beforeend', `<span class="cnt">${game.counted}</span>`);
  el.classList.remove('wave'); void el.offsetWidth; el.classList.add('wave');
  Sound.count(game.counted);
  Voice.say(cap(word(game.counted)));
}

// Gentle hint after a wrong answer: the pictures hop one after another.
function waveItems(){
  const items = [...$('items').querySelectorAll('.item:not(.will-go)')];
  items.forEach((el, k) => setTimeout(() => { el.classList.remove('wave'); void el.offsetWidth; el.classList.add('wave'); }, k * 90));
}

function renderFoods(){
  const choices = makeChoices(game.q);
  const kinds = shuffle(FOODS).slice(0, choices.length);
  $('tray').innerHTML = choices.map((v, i) => {
    const f = kinds[i];
    return `<div class="food" data-value="${v}" aria-label="${v}" style="animation-delay:${200 + i * 120}ms">
      <div class="pop"><div class="float"><svg viewBox="-4 -12 128 136">${f.svg}</svg>
      <span class="num${v > 9 ? ' two' : ''}" style="left:${f.num[0]}%;top:${f.num[1]}%">${v}</span></div></div></div>`;
  }).join('');
  $('tray').querySelectorAll('.food').forEach(el => {
    el.addEventListener('pointerdown', onFoodDown);
    el.addEventListener('pointermove', onFoodMove);
    el.addEventListener('pointerup', onFoodUp);
    el.addEventListener('pointercancel', onFoodUp);
    el.addEventListener('lostpointercapture', onFoodUp);
  });
}

function startRound(level){
  game.level = level;
  game.correct = 0;
  game.busy = false;
  setMeter(0);
  $('playUni').classList.remove('away');
  showScreen('play');
  nextQuestion(level.intro);
}

function nextQuestion(intro){
  game.q = makeQuestion(game.level);
  game.busy = false;
  renderQuestion();
  renderFoods();
  Voice.say((intro ? intro + ' ' : '') + spokenQuestion(game.q));
}

/* =====================================================================
   DRAG & FEED: pointer events for touch and mouse; tap works too.
   ===================================================================== */
let drag = null;
const DRAG_THRESHOLD = 12;   // px of movement before a touch counts as a drag

const setT = (el, x, y, s = 1) => { el.style.transform = `translate(${x}px,${y}px) scale(${s})`; };

function overUnicorn(x, y){
  if (!playUnicorn) return false;
  const r = playUnicorn.querySelector('.u-wig').getBoundingClientRect(), pad = 30;
  return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
}
function setAah(on){ if (playUnicorn) playUnicorn.classList.toggle('aah', on); }

function onFoodDown(e){
  Sound.unlock();
  if (game.busy || drag || (e.button !== undefined && e.button > 0)) return;
  const el = e.currentTarget;
  e.preventDefault();
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { el, id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, moved: false, over: false };
  el.classList.add('dragging');
  setT(el, 0, 0, 1.08);
  Sound.pop();
}
function onFoodMove(e){
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  drag.dx = e.clientX - drag.sx; drag.dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(drag.dx, drag.dy) > DRAG_THRESHOLD) drag.moved = true;
  if (!drag.moved) return;
  setT(drag.el, drag.dx, drag.dy, 1.12);
  const over = overUnicorn(e.clientX, e.clientY);
  if (over !== drag.over){ drag.over = over; setAah(over); }
}
function onFoodUp(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  setAah(false);
  if (e.type !== 'pointerup' || !d.moved){
    if (e.type === 'pointerup') feed(d.el, 0, 0, false);       // a simple tap
    else returnFood(d.el, d.dx, d.dy);                          // cancelled touch
  } else if (overUnicorn(e.clientX, e.clientY)) feed(d.el, d.dx, d.dy, true);
  else returnFood(d.el, d.dx, d.dy);
}

async function returnFood(el, dx, dy){
  await tween(el, [
    { transform: `translate(${dx}px,${dy}px) scale(1.1)` },
    { transform: `translate(${-dx * 0.06}px,${-dy * 0.06}px) scale(.96)`, offset: 0.7 },
    { transform: 'translate(0px,0px) scale(1)' },
  ], { duration: Math.min(650, 300 + Math.hypot(dx, dy) * 0.6), easing: 'ease-out' });
  el.classList.remove('dragging');
  el.style.transform = '';
}

async function feed(el, dx, dy, dropped){
  if (game.busy) { returnFood(el, dx, dy); return; }
  game.busy = true;
  const value = +el.dataset.value;
  const mouth = centerOf(playUnicorn.querySelector('.u-mouth-anchor'));
  const here = centerOf(el);                  // center is unaffected by scale
  const tx = dx + (mouth.x - here.x), ty = dy + (mouth.y - here.y);

  if (value === game.q.answer){
    // ---- Yummy! ----
    setAah(true);
    if (!dropped) await tween(el, [{ transform: `translate(0px,0px) scale(1.08)` },
      { transform: `translate(${tx * .5}px,${ty * .5 - 60}px) scale(1.15)` },
      { transform: `translate(${tx}px,${ty}px) scale(.8)` }], { duration: 480, easing: 'ease-in-out' });
    await tween(el, [{ transform: el.style.transform || `translate(${dx}px,${dy}px) scale(1.1)`, opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) scale(.15)`, opacity: 0 }], { duration: 260, easing: 'ease-in' });
    el.classList.add('eaten'); el.classList.remove('dragging');
    eatAndCheer();
  } else {
    // ---- Not that one: gentle head shake, food bounces home ----
    if (!dropped){
      await tween(el, [{ transform: 'translate(0px,0px) scale(1.08)' },
        { transform: `translate(${tx * .7}px,${ty * .7 - 40}px) scale(1.1)` }], { duration: 380, easing: 'ease-out' });
      dx = tx * .7; dy = ty * .7 - 40;
    }
    el.classList.add('tried');
    playUnicorn.classList.remove('shake'); void playUnicorn.getBoundingClientRect();
    playUnicorn.classList.add('shake');
    Sound.nope();
    await wait(450);
    Sound.boing();
    await returnFood(el, dx, dy);
    playUnicorn.classList.remove('shake');
    waveItems();
    Voice.say(pick(['Hmm! Try another one!', "Let's count together!", 'Try a different one!']));
    game.busy = false;
  }
}

async function eatAndCheer(){
  const u = playUnicorn;
  const mouth = centerOf(u.querySelector('.u-mouth-anchor'));
  u.classList.remove('aah');
  u.classList.add('chomp', 'happy');
  Sound.chomp();
  [0, 300, 600].forEach(t => setTimeout(() => burst(mouth.x, mouth.y + 10, 'crumb', 5), t));
  await wait(900);
  u.classList.remove('chomp');
  u.classList.add('wiggle');
  Sound.chime();
  burst(mouth.x, mouth.y - 40, 'heart', 7);
  burst(mouth.x, mouth.y - 60, 'sparkle', 10);

  // show the answer in the equation
  const bubble = $('answerBubble');
  if (bubble){ bubble.textContent = game.q.answer; bubble.classList.add('filled'); }
  game.correct++;
  setMeter(game.correct);
  $('meter').classList.remove('glow'); void $('meter').getBoundingClientRect(); $('meter').classList.add('glow');

  const q = game.q;
  const line = `${spokenQuestion(q).replace('!', '')} is ${word(q.answer)}! ${pick(YUMMY_WORDS)}`;
  await Promise.all([Voice.say(line), wait(1500)]);
  u.classList.remove('wiggle', 'happy');
  if (!$('play').classList.contains('active')) return;   // child went home meanwhile

  if (game.correct >= QUESTIONS_PER_ROUND) { celebrate(); return; }
  $('tray').querySelectorAll('.food').forEach(f => f.classList.add('leave'));
  await wait(280);
  if (!$('play').classList.contains('active')) return;
  nextQuestion();
}

/* =====================================================================
   CELEBRATION: the unicorn flies across with a rainbow trail + confetti.
   ===================================================================== */
let partyRAF = 0;
async function celebrate(){
  const level = game.level;
  store.stars[level.id] = (+store.stars[level.id] || 0) + 1;
  save();

  const party = $('party'), cv = $('confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  party.classList.add('on');
  $('partyPanel').classList.remove('on');
  $('playUni').classList.add('away');
  $('flyer').innerHTML = unicornSVG('fly');
  const flyerSvg = $('flyer').firstElementChild;
  flyerSvg.classList.add('flying', 'happy');
  Sound.celebrate();
  Voice.say('Hooray! You fed the unicorn! You did it!');

  const fw = $('flyer').offsetWidth, fh = $('flyer').offsetHeight;
  const colours = ['#FF9AA8', '#FFC48A', '#FFE58A', '#9FE6B8', '#8FCBFF', '#C2A8FF'];
  const confetti = [];
  const addConfetti = (n) => { for (let i = 0; i < n; i++) confetti.push({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - .5) * 1.5, vy: 2 + Math.random() * 3,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .25, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6,
    c: pick(colours.concat(['#fff', '#FFB3D9'])), round: Math.random() < .35 }); };
  addConfetti(140);
  const trail = [];
  const FLY_MS = 3600, start = performance.now();
  let lastSparkle = 0;

  const frame = (now) => {
    const t = Math.min(1, (now - start) / FLY_MS);
    ctx.clearRect(0, 0, W, H);
    // flying path: left to right in a happy wave
    if (t < 1){
      const x = -fw + t * (W + fw * 2), y = H * 0.42 + Math.sin(t * Math.PI * 3) * H * 0.14;
      const tilt = Math.cos(t * Math.PI * 3) * -10;
      $('flyer').style.transform = `translate(${x - fw / 2}px,${y - fh / 2}px) rotate(${tilt}deg)`;
      trail.push({ x: x - fw * 0.2, y: y + fh * 0.18, born: now });
      if (now - lastSparkle > 160){ lastSparkle = now; burst(x - fw * .3, y, 'sparkle', 2, .4); }
    } else $('flyer').style.transform = 'translate(-9999px,0)';
    // rainbow trail: stripes that fade with age
    const band = Math.max(7, Math.min(14, H / 60));
    for (let k = 0; k < colours.length; k++){
      ctx.strokeStyle = colours[k]; ctx.lineWidth = band; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
      for (let i = 1; i < trail.length; i++){
        const age = (now - trail[i].born) / 2200;
        if (age >= 1) continue;
        ctx.globalAlpha = 1 - age;
        const off = (k - colours.length / 2) * band * .95;
        ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y + off); ctx.lineTo(trail[i].x, trail[i].y + off); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    while (trail.length && now - trail[0].born > 2200) trail.shift();
    // confetti
    for (const p of confetti){
      p.x += p.vx + Math.sin(now / 400 + p.r) * .6; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round){ ctx.beginPath(); ctx.arc(0, 0, p.h * .7, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    for (let i = confetti.length - 1; i >= 0; i--) if (confetti[i].y > H + 30) confetti.splice(i, 1);
    if (now - start < 2600 && confetti.length < 220) addConfetti(3);
    if (t < 1 || trail.length || confetti.length) partyRAF = requestAnimationFrame(frame);
  };
  cancelAnimationFrame(partyRAF);
  partyRAF = requestAnimationFrame(frame);

  await wait(FLY_MS + 200);
  if (!$('party').classList.contains('on')) return;
  $('playUni').classList.remove('away');
  // the star you earned + Play again / Home
  $('bigStar').innerHTML = ICONS.star;
  $('partyPanel').classList.add('on');
  Sound.star();
  const s = centerOf($('bigStar'));
  setTimeout(() => burst(s.x, s.y, 'sparkle', 14, 1.2), 500);
}
function endParty(){
  cancelAnimationFrame(partyRAF);
  $('party').classList.remove('on');
  $('partyPanel').classList.remove('on');
  $('flyer').innerHTML = '';
}

/* =====================================================================
   SCREENS: start screen, buttons, wiring.
   ===================================================================== */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === name));
  if (name === 'home') renderHome();
  if (name === 'play') requestAnimationFrame(layoutItems);
}

function renderHome(){
  const total = totalStars();
  $('starPill').innerHTML = ICONS.star + `<span>${total}</span>`;
  $('levels').innerHTML = LEVELS.map((lv, i) => {
    const n = +store.stars[lv.id] || 0;
    return `<button class="level-btn" data-i="${i}" aria-label="${lv.intro}" style="--bg:${lv.bg};--shade:${lv.shade};animation-delay:${i * 90}ms">
      <span class="sign">${lv.sign}</span>
      <span class="pips">${ICONS.pip.repeat(lv.pips)}</span>
      <span class="badge">${n ? ICONS.star + n : ''}</span></button>`;
  }).join('');
  $('levels').querySelectorAll('.level-btn').forEach(b => b.addEventListener('click', () => {
    Sound.unlock(); Sound.tap(); endParty();
    startRound(LEVELS[+b.dataset.i]);
  }));
}

function updateMuteButtons(){
  document.querySelectorAll('.mute-btn').forEach(b => {
    b.innerHTML = store.muted ? ICONS.noteOff : ICONS.note;
    b.setAttribute('aria-pressed', store.muted ? 'true' : 'false');
  });
  $('sayBtn').classList.toggle('dim', store.muted);
}

function init(){
  // decorative background bubbles
  const cols = ['#FFC8E1', '#E6DAFF', '#C9F5E3', '#CDEBFF', '#FFF0B3'];
  $('bgDots').innerHTML = Array.from({ length: 14 }, (_, i) => {
    const s = 30 + rand(110);
    return `<i style="width:${s}px;height:${s}px;left:${rand(100)}%;top:${rand(100)}%;background:${cols[i % cols.length]};animation-delay:${-rand(14)}s"></i>`;
  }).join('');

  $('homeUni').innerHTML = unicornSVG('home');
  $('playUni').innerHTML = unicornSVG('play');
  playUnicorn = $('playUni').firstElementChild;
  buildMeter();
  $('sayBtn').innerHTML = ICONS.speaker;
  $('playHomeBtn').innerHTML = ICONS.house;
  $('againBtn').innerHTML = ICONS.again;
  $('homeBtn').innerHTML = ICONS.house;
  updateMuteButtons();
  renderHome();

  // Tap the unicorn on the start screen: it giggles and says hi.
  $('homeUni').addEventListener('click', () => {
    Sound.unlock(); Sound.giggle();
    const u = $('homeUni').firstElementChild;
    u.classList.remove('wiggle'); void u.getBoundingClientRect(); u.classList.add('wiggle', 'happy');
    const m = centerOf(u.querySelector('.u-mouth-anchor'));
    burst(m.x, m.y - 40, 'heart', 6);
    Voice.say("Hi! I'm hungry! Pick a game!");
    setTimeout(() => u.classList.remove('wiggle', 'happy'), 1000);
  });
  document.querySelectorAll('.mute-btn').forEach(b => b.addEventListener('click', () => {
    Sound.unlock();
    store.muted = !store.muted; save();
    if (store.muted) Voice.stop(); else Sound.tap();
    updateMuteButtons();
  }));
  $('sayBtn').addEventListener('click', () => {
    Sound.unlock();
    if (game.q) Voice.say(spokenQuestion(game.q));
  });
  $('playHomeBtn').addEventListener('click', () => {
    Sound.unlock(); Sound.tap(); Voice.stop(); endParty(); showScreen('home');
  });
  $('againBtn').addEventListener('click', () => {
    Sound.unlock(); Sound.tap(); endParty(); startRound(game.level);
  });
  $('homeBtn').addEventListener('click', () => {
    Sound.unlock(); Sound.tap(); Voice.stop(); endParty(); showScreen('home');
    const p = $('starPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
  });

  // Re-fit the counting pictures when the iPad turns.
  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layoutItems); });

  // No scrolling, pinch-zoom, double-tap zoom or long-press menus.
  const stop = (e) => e.preventDefault();
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', stop);
  document.addEventListener('gesturechange', stop);
  document.addEventListener('dblclick', stop);
  document.addEventListener('contextmenu', stop);
  document.addEventListener('selectstart', stop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stop(); });
}
init();
</script>
