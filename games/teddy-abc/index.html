<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teddy ABC">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFF1E4">
<title>Teddy ABC</title>
<!--
  Teddy ABC: learn the English alphabet with a teddy bear (for about age 4-5).

  Every letter has 5 short stages, and each finished stage adds a piece to
  that letter's teddy (body, head, ears, outfit, accessory):
    1. Meet the letter  - it draws itself, says its name and sound, tap every picture
    2. Trace with guides - dotted path, numbered start dots, moving arrow
    3. Trace with only the start dot
    4. Draw it from memory (no guides; if it's not close, try again with a peek)
    5. Find the letter / find the picture that starts with it
  Finishing all 5 completes one of 26 collectible teddies (Teddy Shelf).
  After every 3 finished letters comes a surprise test mixing the last 3 letters;
  finishing it wins a special Pink Teddy (shown on top of the shelf).
  Uppercase first; lowercase opens after all uppercase letters are done
  (finishing a lowercase letter gives its teddy a gold star).

  No reading needed, no timers, no "wrong". Apple Pencil: pressure changes
  the line thickness, and touches are ignored while the pencil is down.

  Everything is in this one file (inline SVG art, Web Audio sounds, the
  built-in speech voice), so it works offline inside the games hub.

  Quick map of the code (search for the "=====" headers):
    LETTERS ....... stroke paths for every letter (stroke order matters)
    WORDS ......... 2-3 picture words per letter + letter sounds   <- edit sounds here
    PICTURES ...... the little SVG drawings
    TEDDIES ....... the 26 teddies and how they are drawn
    STORAGE ....... progress in localStorage
    SOUND/MUSIC ... Web Audio blips, chimes and the soft background tune
    VOICE ......... speechSynthesis wrapper
    INK ........... pointer-event drawing canvas (pencil + finger, palm rejection)
    STAGES ........ meet / trace / free draw / find / surprise test
    SCREENS ....... home, shelf, grown-ups area
-->
<style>
  :root{
    --bg1:#FFF1E4; --bg2:#FDE8F3; --bg3:#E6F0FF;
    --ink:#5B4A6B; --ink-soft:#9A88AE;
    --card:#FFFFFF;
    --pink:#FF85BB; --mint:#7ED9B4; --sky:#7CC4FF; --lav:#B9A3FF; --gold:#FFCF4D; --peach:#FFB38A;
    --wood1:#E9B98A; --wood2:#C98C5A; --wood3:#A86F43;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --top: 96px;
    --bd: min(56vw, calc(100vh - var(--top) - 40px));
    color-scheme: light;
  }
  @media (orientation: portrait){
    :root{ --bd: min(90vw, calc(100vh - var(--top) - 270px)); }
  }
  @media (max-height: 500px){ :root{ --top: 76px; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%; }
  body{
    font-family:var(--font); color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  }
  svg{ display:block; }
  button{
    font:inherit; color:inherit; border:0; padding:0; margin:0; background:none; cursor:pointer;
    touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  [hidden]{ display:none !important; }

  /* ---------- round icon buttons ---------- */
  .btn{
    width:84px; height:84px; border-radius:50%;
    background:var(--card); color:var(--ink);
    box-shadow:0 6px 0 rgba(91,74,107,.12), 0 10px 24px rgba(91,74,107,.12);
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    position:relative; transition:transform .12s;
  }
  .btn:active{ transform:scale(.92); }
  .btn svg.ic{ width:52%; height:52%; }
  .btn.big{ width:clamp(130px,22vmin,190px); height:clamp(130px,22vmin,190px); background:var(--mint); color:#fff; }
  .btn.mid{ width:clamp(100px,15vmin,130px); height:clamp(100px,15vmin,130px); background:var(--peach); color:#fff; }
  .btn.go{ width:clamp(100px,16vmin,136px); height:clamp(100px,16vmin,136px); background:var(--mint); color:#fff; }
  .btn.off{ opacity:.55; }
  .pulse{ animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.1);} }
  .wiggle{ animation:wiggle .5s ease-in-out 2; }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-7deg);} 75%{ transform:rotate(7deg);} }
  .bounce{ animation:bounce .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bounce{ 0%{ transform:scale(1);} 40%{ transform:scale(1.18);} 100%{ transform:scale(1);} }
  .appear{ animation:appear .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes appear{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }

  /* ---------- screens ---------- */
  .screen{ position:absolute; inset:0; display:none; }
  .screen.on{ display:block; }

  /* home */
  #home .home-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    gap:5vmin; padding:24px;
  }
  @media (orientation: portrait){ #home .home-wrap{ flex-direction:column; } }
  .home-teddy{ width:min(46vmin,380px); }
  .home-teddy svg{ width:100%; height:auto; }
  .home-btns{ display:flex; flex-direction:column; align-items:center; gap:4vmin; }
  @media (orientation: portrait){ .home-btns{ flex-direction:row; } }
  .play .letter-badge{
    position:absolute; right:-6px; top:-6px; width:58px; height:58px; border-radius:50%;
    background:#fff; box-shadow:0 4px 10px rgba(91,74,107,.18); padding:8px;
  }
  .corner-bl{ position:absolute; left:calc(env(safe-area-inset-left,0px) + 18px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); }
  .corner-br{ position:absolute; right:calc(env(safe-area-inset-right,0px) + 18px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); }
  .hold{ background:rgba(255,255,255,.6); color:var(--ink-soft); }
  .hold .ring{ position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); transform:rotate(-90deg); pointer-events:none; }
  .hold .ring circle{ fill:none; stroke:var(--lav); stroke-width:6; stroke-linecap:round; stroke-dasharray:289; stroke-dashoffset:289; }
  .hold.holding .ring circle{ stroke-dashoffset:0; transition:stroke-dashoffset 3s linear; }

  /* top bar (keeps the top-left corner free for the hub's ⌂ button) */
  .topbar{
    position:absolute; left:0; right:0; top:0; height:calc(var(--top) + env(safe-area-inset-top,0px));
    padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 14px) 6px calc(env(safe-area-inset-left,0px) + 70px);
    display:flex; align-items:center; gap:14px;
  }
  @media (max-height:500px){ .topbar .btn{ width:68px; height:68px; } }
  .grow{ flex:1; }
  .pips{ display:flex; gap:8px; align-items:center; }
  .pip{ width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.75); box-shadow:inset 0 0 0 3px rgba(185,163,255,.5); }
  .pip.done{ background:var(--gold); box-shadow:inset 0 0 0 3px rgba(232,169,43,.6); }
  .pip.now{ background:#fff; box-shadow:inset 0 0 0 4px var(--pink); animation:pulse 1.4s infinite; }
  .mini{ width:74px; height:84px; background:rgba(255,255,255,.7); border-radius:24px; padding:4px; }
  .mini svg{ width:100%; height:100%; }
  @media (max-width:520px){
    .topbar{ gap:8px; padding-left:calc(env(safe-area-inset-left,0px) + 62px); }
    .topbar .btn{ width:66px; height:66px; }
    .pips{ gap:5px; } .pip{ width:14px; height:14px; }
    .mini{ width:56px; height:66px; border-radius:18px; }
  }
  .btn.mint{ background:var(--mint); color:#fff; }

  /* letter screen layout */
  .stage{
    position:absolute; left:0; right:0; bottom:0; top:calc(var(--top) + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:center; gap:4vmin;
    padding:8px calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);
  }
  @media (orientation: portrait){ .stage{ flex-direction:column; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px); } }
  .board{
    position:relative; width:var(--bd); height:var(--bd); flex:0 0 auto;
    background:#fff; border-radius:min(6vmin,40px);
    box-shadow:0 8px 0 rgba(91,74,107,.08), 0 16px 40px rgba(91,74,107,.12);
    overflow:hidden;
  }
  .board > svg, .board > canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .board canvas{ touch-action:none; }
  .side{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vmin; min-width:0; }
  @media (orientation: portrait){ .side{ flex-direction:row; padding-left:110px; } }
  @media (orientation: landscape){
    .side-l{ width:calc((100vw - var(--bd)) / 2 - 40px); }
    .side{ flex-wrap:wrap; max-height:100%; align-content:center; }
  }
  @media (orientation: portrait){ .side-l:empty{ display:none; } }
  .pic{
    width:clamp(96px, 16vmin, 150px); height:clamp(96px, 16vmin, 150px);
    border-radius:28px; background:#fff; padding:10px; flex:0 0 auto;
    box-shadow:0 6px 0 rgba(91,74,107,.1), 0 10px 22px rgba(91,74,107,.12);
  }
  .pic svg{ width:100%; height:100%; }
  .pic.seen{ box-shadow:0 6px 0 rgba(91,74,107,.1), 0 0 0 5px var(--gold); }
  @media (orientation: portrait) and (max-width:500px){ .pic{ width:88px; height:88px; } .side{ padding-left:92px; gap:10px; } }

  /* find game */
  .choices{ display:flex; gap:4vmin; align-items:center; justify-content:center; flex-wrap:nowrap; }
  .card{
    width:min(26vw, 30vh, 260px); height:min(26vw, 30vh, 260px);
    background:#fff; border-radius:min(5vmin,36px); padding:4%;
    box-shadow:0 8px 0 rgba(91,74,107,.1), 0 14px 30px rgba(91,74,107,.12);
  }
  .card svg{ width:100%; height:100%; }
  .card.yay{ box-shadow:0 8px 0 rgba(91,74,107,.1), 0 0 0 7px var(--mint); }
  .find-wrap{ display:flex; flex-direction:column; align-items:center; gap:4vmin; }
  .target{ width:min(20vw,22vh,180px); height:min(20vw,22vh,180px); background:#FFF8D9; border-radius:30px; padding:3%; box-shadow:0 0 0 5px var(--gold); }
  .target svg{ width:100%; height:100%; }
  .find-wrap .pic{ width:min(24vw,26vh,220px); height:min(24vw,26vh,220px); }

  /* guide teddy */
  .guide{
    position:absolute; left:calc(env(safe-area-inset-left,0px) + 10px); bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
    width:clamp(92px, 15vmin, 140px); height:clamp(110px, 18vmin, 168px); z-index:5;
  }
  .guide svg.teddy{ width:100%; height:100%; transform-origin:50% 100%; }
  .guide.talk svg.teddy{ animation:talk .5s ease-in-out infinite; }
  @keyframes talk{ 0%,100%{ transform:translateY(0) rotate(0);} 30%{ transform:translateY(-6px) rotate(-3deg);} 70%{ transform:translateY(-3px) rotate(3deg);} }
  .waves{ position:absolute; right:-18px; top:4px; width:40px; height:40px; opacity:0; transition:opacity .2s; }
  .guide.talk .waves{ opacity:1; }
  .waves path{ fill:none; stroke:var(--pink); stroke-width:4; stroke-linecap:round; animation:wv 1s infinite; }
  .waves path:nth-child(2){ animation-delay:.2s; }
  @keyframes wv{ 0%,100%{ opacity:.25;} 50%{ opacity:1;} }

  /* teddy parts */
  .popin{ animation:popin .7s cubic-bezier(.3,1.7,.5,1) both; transform-box:fill-box; transform-origin:50% 60%; }
  @keyframes popin{ 0%{ transform:scale(0); opacity:0;} 60%{ opacity:1;} 100%{ transform:scale(1);} }
  .arm-r{ transform-box:fill-box; transform-origin:20% 15%; }
  .wave .arm-r{ animation:waveArm .45s ease-in-out 4; }
  @keyframes waveArm{ 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(-55deg);} }
  .giggle{ animation:giggle .18s ease-in-out 8; transform-origin:50% 100%; }
  @keyframes giggle{ 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(4deg) translateY(-2px);} }
  .cheer{ animation:cheer .6s ease-in-out 3; transform-origin:50% 100%; }
  @keyframes cheer{ 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-14px) scale(1.04);} }

  /* overlay: teddy grows a new part */
  #ov{
    position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vmin;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.96), rgba(255,241,228,.94) 60%, rgba(253,232,243,.94));
    animation:fadein .3s both;
  }
  @keyframes fadein{ from{ opacity:0;} to{ opacity:1;} }
  .ov-teddy{ width:min(54vmin,420px); position:relative; }
  .ov-teddy svg.teddy{ width:100%; height:auto; }
  .ov-btns{ display:flex; gap:5vmin; align-items:center; }
  .rays{ position:absolute; inset:-25%; z-index:-1; animation:spin 14s linear infinite; opacity:.7; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* shelf */
  #shelf .scroll{
    position:absolute; left:0; right:0; bottom:0; top:calc(var(--top) + env(safe-area-inset-top,0px));
    overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain;
    padding:10px calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 20px);
  }
  .shelves{
    max-width:1100px; margin:0 auto; padding:18px 18px 4px; border-radius:30px;
    background:linear-gradient(#FBE3C8,#F6D3AE); box-shadow:inset 0 0 0 10px var(--wood2), 0 14px 30px rgba(91,74,107,.15);
    display:grid; grid-template-columns:repeat(7, 1fr); row-gap:22px;
  }
  @media (orientation: portrait){ .shelves{ grid-template-columns:repeat(5, 1fr); } }
  @media (orientation: portrait) and (max-width:500px){ .shelves{ grid-template-columns:repeat(4, 1fr); } }
  .slot{ position:relative; padding:4px 6px 26px; display:flex; flex-direction:column; align-items:center; min-height:80px; }
  .slot::after{
    content:""; position:absolute; left:-18px; right:-18px; bottom:0; height:22px;
    background:linear-gradient(var(--wood1), var(--wood2) 60%, var(--wood3));
  }
  .slot .teddy{ width:100%; height:auto; position:relative; z-index:1; }
  .slot .tag{
    position:absolute; bottom:-6px; z-index:2; width:40px; height:40px; border-radius:50%;
    background:#fff; box-shadow:0 3px 6px rgba(91,74,107,.2); padding:5px;
  }
  .slot .tag svg{ width:100%; height:100%; }
  .slot .gstar{ position:absolute; top:2px; right:6px; width:30%; z-index:2; }
  /* Pink Teddies won in surprise tests */
  .pinks{
    max-width:1100px; margin:0 auto 18px; padding:10px 18px; border-radius:30px;
    background:linear-gradient(#FFE3F0,#FFC9E1); box-shadow:inset 0 0 0 6px #FF9CC8, 0 10px 24px rgba(91,74,107,.12);
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
  }
  .pinks button{ width:clamp(64px, 11vmin, 100px); }
  .pinks .teddy{ width:100%; height:auto; }
  .quiz-intro{ width:min(50vmin, 360px); }
  .quiz-intro svg{ width:100%; height:auto; }

  /* grown-ups area */
  #parent{ background:rgba(250,246,255,.98); z-index:70; }
  #parent .scroll{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:calc(env(safe-area-inset-top,0px) + 70px) 20px 40px; }
  .panel{ max-width:720px; margin:0 auto; font-size:18px; }
  .panel h2{ margin:0 0 6px; font-size:26px; }
  .panel h3{ margin:22px 0 10px; font-size:19px; color:var(--ink-soft); }
  .panel p{ margin:6px 0; color:var(--ink-soft); font-size:15px; line-height:1.4; }
  .row{ display:flex; flex-wrap:wrap; gap:10px; }
  .pbtn{ min-height:52px; padding:0 20px; border-radius:16px; background:#fff; box-shadow:0 2px 0 rgba(91,74,107,.12), 0 0 0 2px #E7DDF7; font-size:17px; }
  .pbtn.sel{ background:var(--lav); color:#fff; box-shadow:none; }
  .pbtn.danger{ background:#FFE3EA; box-shadow:0 0 0 2px #FFC2D1; }
  .pbtn.danger.armed{ background:#FF7A9A; color:#fff; }
  .lgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(58px,1fr)); gap:8px; }
  .lbtn{ height:58px; border-radius:14px; background:#fff; box-shadow:0 0 0 2px #E7DDF7; font-size:24px; font-weight:700; position:relative; }
  .lbtn small{ position:absolute; left:4px; right:4px; bottom:4px; height:5px; border-radius:3px; background:#EEE7F8; overflow:hidden; }
  .lbtn small i{ display:block; height:100%; background:var(--mint); }
  .lbtn.cur{ box-shadow:0 0 0 3px var(--pink); }
  .pclose{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:calc(env(safe-area-inset-right,0px) + 14px); z-index:2; }

  #fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }
  #measure{ position:absolute; width:0; height:0; overflow:hidden; }
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="home">
    <div class="home-wrap">
      <button class="home-teddy" id="homeTeddy" aria-label="Teddy"></button>
      <div class="home-btns">
        <button class="btn big play" id="playBtn" aria-label="Play"><span data-icon="play"></span><span class="letter-badge" id="playLetter"></span></button>
        <button class="btn mid" id="shelfBtn" aria-label="Teddy shelf"><span data-icon="shelf"></span></button>
      </div>
    </div>
    <button class="btn corner-bl" id="musicBtn" aria-label="Music on or off"></button>
    <button class="btn corner-br hold" id="parentBtn" aria-label="Grown-ups: hold for 3 seconds">
      <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg>
      <span data-icon="lock"></span>
    </button>
  </section>

  <section class="screen" id="letter">
    <div class="topbar">
      <button class="btn" data-go="home" aria-label="Home"><span data-icon="home"></span></button>
      <button class="btn" id="replayBtn" aria-label="Say it again"><span data-icon="speaker"></span></button>
      <div class="grow"></div>
      <div class="pips" id="pips"></div>
      <div class="mini" id="miniTeddy"></div>
    </div>
    <div class="stage" id="stage"></div>
    <button class="guide" id="guide" aria-label="Teddy helper"></button>
  </section>

  <section class="screen" id="shelf">
    <div class="topbar">
      <button class="btn" data-go="home" aria-label="Home"><span data-icon="home"></span></button>
      <div class="grow"></div>
      <button class="btn mint" id="shelfPlay" aria-label="Play"><span data-icon="play"></span></button>
    </div>
    <div class="scroll"><div class="pinks" id="pinks" hidden></div><div class="shelves" id="shelves"></div></div>
  </section>

  <section class="screen" id="parent">
    <button class="btn pclose" id="parentClose" aria-label="Close"><span data-icon="close"></span></button>
    <div class="scroll"><div class="panel" id="panel"></div></div>
  </section>

  <div id="ov" hidden>
    <div class="ov-teddy" id="ovTeddy"></div>
    <div class="ov-btns" id="ovBtns"></div>
  </div>
  <canvas id="fx"></canvas>
</div>

<!-- shared SVG defs: soft silhouette filter and the teddy body clip -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="sil" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.84  0 0 0 0 0.80  0 0 0 0 0.90  0 0 0 1 0"/>
    </filter>
    <clipPath id="tbody"><ellipse cx="60" cy="104" rx="30" ry="32"/></clipPath>
  </defs>
</svg>
<svg id="measure" aria-hidden="true"><path id="mpath" d="M0 0"/></svg>
<script>
'use strict';
/* =====================================================================
   LETTERS: one SVG path per stroke, listed in stroke order, drawn in the
   direction a child should write it. Uppercase sits between y=10 (top)
   and y=90 (baseline). Lowercase: ascender 10, x-height 45, baseline 90,
   descender down to 110.
   ===================================================================== */
const UP = {
  A:['M50 10 L18 90','M50 10 L82 90','M31 62 L69 62'],
  B:['M26 10 L26 90','M26 10 L50 10 Q72 10 72 29 Q72 48 50 48 L26 48 L54 48 Q78 48 78 69 Q78 90 54 90 L26 90'],
  C:['M78 26 C66 6 22 6 22 50 C22 94 66 94 78 74'],
  D:['M26 10 L26 90','M26 10 L44 10 C88 10 88 90 44 90 L26 90'],
  E:['M28 10 L28 90','M28 10 L74 10','M28 50 L66 50','M28 90 L74 90'],
  F:['M30 10 L30 90','M30 10 L76 10','M30 50 L68 50'],
  G:['M78 26 C66 6 20 6 20 50 C20 94 78 96 78 58','M78 58 L54 58'],
  H:['M24 10 L24 90','M76 10 L76 90','M24 50 L76 50'],
  I:['M50 10 L50 90','M30 10 L70 10','M30 90 L70 90'],
  J:['M62 10 L62 66 C62 96 22 96 22 72','M40 10 L84 10'],
  K:['M28 10 L28 90','M74 10 L28 56','M42 44 L78 90'],
  L:['M30 10 L30 90','M30 90 L74 90'],
  M:['M20 10 L20 90','M20 10 L50 62 L80 10 L80 90'],
  N:['M24 10 L24 90','M24 10 L76 90 L76 10'],

<script>

/* =====================================================================
   TEDDY drawing. parts: 0 none, 1 body, 2 +head, 3 +ears, 4 +outfit, 5 +accessory
   ===================================================================== */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const SW = `stroke="${OL}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;

function outfitSVG(t){
  const [type, c, c2] = t.out; if (type === 'none') return '';

  const clip = inner => `<g clip-path="url(#tbody)">${inner}</g>`;

  switch (type){
    case 'shirt': return clip(shirt + `<path d="M50 74 Q60 82 70 74" fill="none" ${SW}/>`) + body;
    case 'stripes': return clip(shirt + [84, 100, 116, 132].map(y => `<rect x="20" y="${y}" width="80" height="8" fill="${c2}"/>`).join('')) + body;
    case 'rainbow': return clip(['#FF6B6B','#FFB347','#FFE066','#7ED957','#7CC4FF','#B983FF','#FF85BB'].map((k, i) => `<rect x="20" y="${72 + i * 10}" width="80" height="10" fill="${k}"/>`).join('')) + body;
    case 'overalls': return clip(`<rect x="20" y="104" width="80" height="50" fill="${c}"/><rect x="46" y="86" width="28" height="22" rx="3" fill="${c}" ${SW}/><path d="M50 72 L48 88 M70 72 L72 88" ${SW} stroke-width="4"/><rect x="54" y="92" width="12" height="8" rx="2" fill="none" ${SW} stroke-width="1.8"/>`) + `<circle cx="49" cy="90" r="2.4" fill="#FFD93D" ${SW} stroke-width="1.4"/><circle cx="71" cy="90" r="2.4" fill="#FFD93D" ${SW} stroke-width="1.4"/>` + body;
    case 'coat': return clip(shirt + (c === '#FFFFFF' || c === '#EEF2FF' ? '' : `<rect x="20" y="114" width="80" height="6" fill="#F5F5F5"/><rect x="20" y="128" width="80" height="6" fill="#F5F5F5"/>`) + `<path d="M60 76 L60 140" fill="none" ${SW} stroke-width="2"/><path d="M48 74 L60 92 L72 74" fill="none" ${SW}/>`) + [96, 108, 120].map(y => `<circle cx="65" cy="${y}" r="2" fill="${OL}"/>`).join('') + body;
    case 'hero': return clip(shirt + `<rect x="20" y="118" width="80" height="7" fill="#FFD93D"/>`) + `<path d="${starPath(60, 100, 11, 5)}" fill="#FFD93D" ${SW} stroke-width="2"/>` + body;
    case 'suit': return clip(shirt + `<path d="M48 72 L60 104 L72 72Z" fill="#fff"/>`) + `<path d="M50 80 L60 85 L70 80 L70 90 L60 85 L50 90Z" fill="#FF6B6B" ${SW} stroke-width="2"/>` + body;
    case 'pajamas': return clip(shirt + [[42,88],[64,84],[78,100],[50,104],[68,118],[40,122],[58,134],[80,130]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" opacity=".85"/>`).join('')) + body;
    case 'dress': return clip(shirt) + `<path d="M36 110 L22 142 Q60 152 98 142 L84 110Z" fill="${c}" ${SW}/><path d="M28 136 Q60 146 92 136" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>` + body;

  }

// Pick the most natural-sounding English voice on this device. Premium / Enhanced
// voices (iPad: Settings > Accessibility > Spoken Content > Voices) and Natural /
// Neural voices (Edge, Chrome) sound far more human than the default ones.
function bestVoice(){
  let vs = []; try { vs = speechSynthesis.getVoices() || []; } catch (e){}

  const online = navigator.onLine !== false;

    const id = v.name + ' ' + (v.voiceURI || '');
    let s = 0;
    if (/premium/i.test(id)) s += 60; else if (/enhanced/i.test(id)) s += 45;
    if (/natural|neural/i.test(id)) s += 50;
    if (/compact/i.test(id)) s -= 15;

    if (i >= 0) s += 30 - i;
    if (/en[-_]US/i.test(v.lang)) s += 8; else if (/en[-_](GB|AU|IE|NZ)/i.test(v.lang)) s += 5;
    if (v.localService === false) s -= online ? 5 : 200;   // online-only voices go silent offline

    const s = score(v); if (s > bs){ bs = s; best = v; }
  }

/* =====================================================================
   GEOMETRY for checking a trace
   ===================================================================== */
function samplePath(d){
  const mp = $('mpath'); mp.setAttribute('d', d);

// unit direction at every point, measured over a few neighbours so wobbles don't matter
function withDirs(pts, span = 2){
  for (let i = 0; i < pts.length; i++){

    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy);

// the child's line, evened out to one point every 2 units (with directions)

// Returns the covered fraction.
function cover(guide, ink, tol, covered){
  const dot = guide.length <= 4;  // tiny stroke = the dot on i / j
  guide.forEach((s, i) => {
    if (covered[i]) return;
    for (const p of ink){
      if (Math.abs(p.x - s.x) > tol || Math.abs(p.y - s.y) > tol || Math.hypot(p.x - s.x, p.y - s.y) > tol) continue;
      if (dot || (!p.dx && !p.dy) || Math.abs(p.dx * s.dx + p.dy * s.dy) >= .6){ covered[i] = true; break; }

// One finished line while tracing. The current stroke collects coverage over several

// and the line must be long enough for everything it completes (so tracing the round

}
// fraction of the child's points that are near any part of the letter
function nearFrac(ink, guides, tol){
  let near = 0;
  for (const p of ink){ if (guides.some(G => G.some(s => Math.abs(s.x - p.x) < tol && Math.abs(s.y - p.y) < tol && Math.hypot(s.x - p.x, s.y - p.y) < tol))) near++; }

// FREE_EASY: the forgiving check used when the child taps "done".
const FREE = { tol:11, ptol:9, avg:.66, min:.4, prec:.72, lr:2 };

// free drawing: fit the child's drawing onto the letter's box, then compare shapes both ways
function freeScore(inkStrokes, guides, T = FREE){
  const all = inkStrokes.flatMap(s => s.pts);

  const box = pts => { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; pts.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }); return { x0, y0, w:x1 - x0, h:y1 - y0 }; };

/* =====================================================================

function letterBoard(el, m, L, o){

    <g stroke="#EFE6FA" stroke-width=".9" stroke-dasharray="3 3">${lines.map((y, i) => `<line x1="${vb[0] + 3}" x2="${vb[0] + vb[2] - 3}" y1="${y}" y2="${y}"${i === 2 ? ' stroke="#E3D6F5" stroke-dasharray="none"' : ''}/>`).join('')}</g>

    <g fill="none" stroke="#C7B3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${o.dots ? `<g stroke-dasharray=".1 5.5">${paths.map(P).join('')}</g>` + chevrons : ''}</g>
    <path class="trail" d="M0 0" fill="none" stroke="#FFB3D1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g class="starts"></g>
    <g class="arrow" opacity="0"><circle r="5.5" fill="#FF6FA8" stroke="#fff" stroke-width="1.6"/><path d="M-2.2 -3 L2.4 0 L-2.2 3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

    setCurrent(k){

    // moves the arrow along stroke k; keep = leave the stroke drawn (used by "meet")

const FX = {

  burst(n = 130){
    const cv = $('fx'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;

    const cols = ['#FF85BB', '#7ED9B4', '#7CC4FF', '#FFCF4D', '#B9A3FF', '#FFB38A'];
    for (let i = 0; i < n; i++) this.parts.push({ x:W * (.3 + Math.random() * .4), y:H * .45, vx:(Math.random() - .5) * 16, vy:-Math.random() * 15 - 5, r:Math.random() * 7 + 5, c:cols[i % cols.length], a:Math.random() * 6, va:(Math.random() - .5) * .4, sh:Math.random() < .5 });

  },

    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.parts = this.parts.filter(p => p.y < H + 30);

      c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c;

}

// Stage 1: meet the letter
function stMeet(){
  const { m, L } = sess;
  stageEl().innerHTML = `<div class="side side-l"></div><div class="board" id="board"></div><div class="side side-l" id="side">${WORDS[L].map(picBtn).join('')}<button class="btn go" id="next" aria-label="Next" hidden><span data-icon="play"></span></button></div>`;
  icons(stageEl());
  const B = letterBoard($('board'), m, L, { ghost:true });
  const next = $('next');
  const reveal = () => { if (next.hidden){ next.hidden = false; next.classList.add('appear'); later(() => { next.classList.remove('appear'); next.classList.add('pulse'); }, 500); } };
  const intro = () => {
    B.animate();
    Voice.say(`This is ${nm(m, L)}. It says ${SOUND[L]}, like ${w0(L)}!`);
  };
  $('board').addEventListener('click', intro);
  // every picture starts with this letter, so the child taps all of them before moving on
  const unseen = () => [...$('side').querySelectorAll('.pic:not(.seen)')];
  bindPics($('side'), () => { if (!unseen().length) later(reveal, 900); });
  next.addEventListener('click', () => { Snd.tap(); stageDone(); });
  sess.replay = intro;
  sess.hint = () => {
    const left = unseen();
    if (!left.length){ reveal(); Voice.say('Tap the green button!'); return; }
    left.forEach(p => { p.classList.remove('wiggle'); void p.offsetWidth; p.classList.add('wiggle'); });
    Voice.say(left.length < WORDS[L].length ? 'Tap the other picture too!' : 'Tap the pictures!');
  };
  later(intro, 400);
}

// Stages 2 + 3: trace (guided = dots + arrows; otherwise only the start dot)
function stTrace(guided){
  const { m, L } = sess, N = nm(m, L);
  stageEl().innerHTML = `<div class="side side-l"></div><div class="board" id="board"></div><div class="side side-l"></div>`;
  const B = letterBoard($('board'), m, L, { ghost:true, dots:guided, nums:guided ? 'all' : 'current' });
  const n = B.samples.length, tol = guided ? 13 : 14;
  const done = new Array(n).fill(false), covered = B.samples.map(s => new Array(s.pts.length).fill(false));
  let cur = 0, misses = 0, finished = false;
  B.setCurrent(0);

  const hintArrow = loop => B.hint(cur, loop);
  const onEnd = s => {
    if (finished) return;
    const ink = resample(s.pts);
    if (!ink.length) return;
    if (nearFrac(ink, B.samples.map(x => x.pts), 18) < .55){
      Ink.fade(s); misses++;
      later(() => hintArrow(guided), 350);
      if (misses % 2 === 1) Voice.say(guided ? "Let's follow the arrow together!" : 'Start at the green dot!');
      return;
    }
    const got = traceEval(B.samples, done, covered, cur, ink, tol);
    if (!got.length) return;
    got.forEach(i => { done[i] = true; B.markDone(i); });
    if (done.every(Boolean)){
      finished = true; Ink.enabled = false; B.setCurrent(-1); B.stop();
      FX.burst(); Snd.happy();
      $('board').classList.add('bounce');
      Voice.say(`Yes! ${cap(N)} is for ${w0(L)}!`, () => later(stageDone, 500));
      return;
    }
    Snd.ding();
    cur = done.indexOf(false); B.setCurrent(cur);
    if (guided) later(() => hintArrow(true), 500);
  };
  Ink.attach($('board'), VB[m], B.color, onEnd, () => B.stop());
  const intro = () => {
    Voice.say(guided ? `Let's trace ${N}! Start at the green dot, and follow the arrow.` : `Now trace ${N}, with just the dot. You can do it!`);
    hintArrow(guided);
  };
  sess.replay = intro;
  sess.hint = () => { hintArrow(false); Voice.say(guided ? 'Start at the green dot, and follow the arrow!' : `Start at the green dot, and draw ${N}!`); };
  later(intro, 350);
}

// Stage 4a: draw from memory
function stFree(){
  const { m, L } = sess, N = nm(m, L);
  stageEl().innerHTML = `<div class="side side-l"></div><div class="board" id="board"></div><div class="side side-l" id="side"><button class="btn" id="clr" aria-label="Start again"><span data-icon="redo"></span></button><button class="btn go" id="ok" aria-label="Done" hidden><span data-icon="check"></span></button></div>`;
  icons(stageEl());
  const B = letterBoard($('board'), m, L, { ghost:false });
  const ok = $('ok');
  let finished = false, tries = 0;
  const live = () => Ink.strokes.filter(s => !s.fadeAt);   // ignore lines that are fading away
  const success = () => {
    if (finished) return; finished = true; Ink.enabled = false;
    FX.burst(); Snd.happy(); ok.hidden = true;
    Voice.say(B.keepGhost ? `Wow! You drew ${N}!` : `Wow! You drew ${N} all by yourself!`, () => later(stageDone, 400));
  };
  // Not close enough yet: no "wrong", just wipe it and try again with a bit more help each time
  // (a peek at the letter, then the light letter stays on the board to draw over).
  const tryAgain = () => {
    tries++; Snd.soft(); ok.hidden = true; ok.classList.remove('pulse');
    Ink.strokes.forEach(s => Ink.fade(s));
    if (tries >= 2){ B.showGhost(); Voice.say(`Almost! Let's try again. Draw ${N} on the light letter.`); }
    else { B.peek(); Voice.say(`Almost! Let's try again. Here is a little peek at ${N}.`); }
  };
  Ink.attach($('board'), VB[m], B.color, () => {
    if (finished) return;
    if (ok.hidden){ ok.hidden = false; ok.classList.add('appear'); }
    if (freeScore(live(), B.samples).ok) later(success, 250);
  });
  $('clr').addEventListener('click', () => { Snd.soft(); Ink.clear(); ok.hidden = true; });
  ok.addEventListener('click', () => {
    if (finished) return;
    Snd.tap();
    if (freeScore(live(), B.samples, FREE_EASY).ok) success(); else tryAgain();
  });
  const intro = () => Voice.say(`Can you draw ${N} all by yourself?`);
  sess.replay = intro;
  sess.hint = n => {
    B.peek(); Voice.say(`Here is a little peek! Draw ${N}.`);
    if (n >= 1 && live().length){ ok.hidden = false; ok.classList.add('pulse'); }
  };
  later(intro, 350);
}

// Stage 4b: find the letter, then the picture that starts with it
function stFind(){
  const { m, L } = sess, N = nm(m, L);
  let busy = false;
  const round1 = () => {
    const opts = shuffle([L, ...pickOther([L], 2)]);
    stageEl().innerHTML = `<div class="choices">${opts.map(c => `<button class="card" data-l="${c}" aria-label="${c}">${glyphSVG(m, c, '#5B4A6B', 11)}</button>`).join('')}</div>`;
    const ask = () => Voice.say(`Find ${N}!`);
    stageEl().querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      b.classList.remove('wiggle', 'bounce'); void b.offsetWidth;
      if (b.dataset.l === L){
        busy = true; b.classList.add('yay', 'bounce'); Snd.sparkle();
        Voice.say(`Yes! That's ${N}!`, () => later(round2, 300));
      } else { b.classList.add('wiggle'); Snd.soft(); Voice.say(`That's ${nm(m, b.dataset.l)}. Can you find ${N}?`); }
    }));
    sess.replay = ask; sess.hint = ask;
    later(ask, 350);
  };
  const round2 = () => {
    busy = false;
    const right = shuffle(startWords(L))[0];
    const wrong = pickOther([L], 2).map(x => startWords(x)[0]);
    const opts = shuffle([right, ...wrong]);
    stageEl().innerHTML = `<div class="find-wrap"><div class="target">${glyphSVG(m, L, crayonOf(L), 11)}</div><div class="choices">${opts.map(w => `<button class="pic" data-w="${w}" aria-label="${wordOf(w)}">${picSVG(picKey(w))}</button>`).join('')}</div></div>`;
    const ask = () => Voice.say(`Which one starts with ${N}?`);
    stageEl().querySelectorAll('.pic').forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      b.classList.remove('wiggle', 'bounce'); void b.offsetWidth;
      const w = wordOf(b.dataset.w);
      if (b.dataset.w === right){
        busy = true; b.classList.add('seen', 'bounce'); Snd.sparkle(); FX.burst(60);
        Voice.say(`Yes! ${cap(w)} starts with ${NAMES[L]}!`, () => later(stageDone, 400));
      } else { b.classList.add('wiggle'); Snd.soft(); Voice.say(`${cap(w)}! Which one starts with ${N}?`); }
    }));
    sess.replay = ask; sess.hint = ask;
    later(ask, 350);
  };
  round1();
}

function raysSVG(color){
  return `<svg class="rays" viewBox="-50 -50 100 100" aria-hidden="true">${[...Array(12)].map((_, i) => `<path d="M0 0 L${(60 * Math.cos(i * Math.PI / 6 - .12)).toFixed(1)} ${(60 * Math.sin(i * Math.PI / 6 - .12)).toFixed(1)} L${(60 * Math.cos(i * Math.PI / 6 + .12)).toFixed(1)} ${(60 * Math.sin(i * Math.PI / 6 + .12)).toFixed(1)}Z" fill="${color}"/>`).join('')}</svg>`;
}

/* Surprise test: after every few finished letters, a few quick questions that mix the last
   3 letters ("find the letter" and "which picture starts with it"). Each right answer adds a
   piece to the Pink Teddy; finishing wins one for the shelf. No "wrong", just try again. */
const QUIZ_ROUNDS = 5;
function startQuiz(m){
  const letters = S.recent[m].slice(-3);
  // every letter at least once, and never the same letter twice in a row
  let qs;
  do { qs = shuffle([...letters, ...shuffle(letters).slice(0, QUIZ_ROUNDS - letters.length)]); }
  while (qs.some((L, i) => i && qs[i - 1] === L));
  const types = shuffle(['letter', 'letter', 'pic', 'pic', rand(2) ? 'letter' : 'pic']);
  show('letter');
  sess = { m, L:qs[0], quiz:true, letters, qs, types, stage:0 };
  renderTop();
  stageEl().innerHTML = `<div class="quiz-intro appear">${teddySVG('pink', 5, { sil:true })}</div>`;
  const intro = () => Voice.say("Surprise! It's a teddy test! Get them all, and win a Pink Teddy!", () => later(quizRound, 300));
  sess.replay = null; sess.hint = null;
  later(() => { Snd.sparkle(); intro(); }, 350);
}
function quizRound(){
  newGen();
  const { m, stage, letters } = sess, L = sess.qs[stage], N = nm(m, L);
  sess.L = L;
  renderTop(stage > 0 ? stage - 1 : undefined);
  let busy = false, ask;
  if (sess.types[stage] === 'letter'){
    stageEl().innerHTML = `<div class="choices">${shuffle(letters).map(c => `<button class="card" data-l="${c}" aria-label="${c}">${glyphSVG(m, c, '#5B4A6B', 11)}</button>`).join('')}</div>`;
    ask = () => Voice.say(`Find ${N}!`);
  } else {
    const opts = shuffle(letters.map(x => ({ l:x, w:shuffle(startWords(x))[0] })));
    stageEl().innerHTML = `<div class="find-wrap"><div class="target">${glyphSVG(m, L, crayonOf(L), 11)}</div><div class="choices">${opts.map(o => `<button class="pic" data-l="${o.l}" data-w="${o.w}" aria-label="${wordOf(o.w)}">${picSVG(picKey(o.w))}</button>`).join('')}</div></div>`;
    ask = () => Voice.say(`Which one starts with ${N}?`);
  }
  stageEl().querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (busy) return;
    b.classList.remove('wiggle', 'bounce'); void b.offsetWidth;
    const w = b.dataset.w ? cap(wordOf(b.dataset.w)) : '';
    if (b.dataset.l === L){
      busy = true; b.classList.add(w ? 'seen' : 'yay', 'bounce'); Snd.sparkle();
      sess.stage++; renderTop(sess.stage - 1); later(() => Snd.pop(), 150);
      Voice.say(w ? `Yes! ${w} starts with ${N}!` : `Yes! That's ${N}!`, () => later(sess.stage >= QUIZ_ROUNDS ? quizDone : quizRound, 300));
    } else {
      b.classList.add('wiggle'); Snd.soft();
      Voice.say(w ? `${w}! Which one starts with ${N}?` : `That's ${nm(m, b.dataset.l)}. Can you find ${N}?`);
    }
  }));
  sess.replay = ask; sess.hint = ask;
  later(ask, 350);
}
function quizDone(){
  const { m } = sess;
  S.pink++; S.since[m] = 0; save();
  newGen();
  const ov = $('ov'); ov.hidden = false;
  $('ovTeddy').innerHTML = raysSVG('#FFD3E6') + teddySVG('pink', 5);
  $('ovBtns').innerHTML = `<button class="btn go pulse" id="ovGo" aria-label="Next"><span data-icon="play"></span></button><button class="btn mid" id="ovShelf" aria-label="Teddy shelf"><span data-icon="shelf"></span></button>`;
  icons($('ovBtns'));
  const teddy = $('ovTeddy').querySelector('svg.teddy');
  later(() => { FX.burst(180); Snd.happy(); teddy.classList.add('cheer'); Voice.say('Hooray! You did the whole test! You won a special Pink Teddy!'); }, 400);
  $('ovGo').addEventListener('click', () => { Snd.tap(); ov.hidden = true; afterLetter(m); });
  $('ovShelf').addEventListener('click', () => { Snd.tap(); show('shelf'); });
}

// A stage is finished: save, then show the teddy getting its new part
function stageDone(){
  const { m, L, stage, practice } = sess, n = stage + 1;
  if (!practice && prog(m, L) < n){
    S[m][L] = n;
    if (n >= 5){
      if (S.focus[m] === L) S.focus[m] = null;
      S.recent[m] = [...S.recent[m].filter(x => x !== L), L].slice(-3);
      S.since[m]++;
    }
    save();
  }
  newGen();
  const complete = n >= 5, t = TEDDY[L];
  const ov = $('ov'); ov.hidden = false;
  const rays = complete ? raysSVG('#FFE9A8') : '';
  $('ovTeddy').innerHTML = rays + teddySVG(L, n, { newPart:n - 1, ghost:true, star:complete && m === 'lo' });
  $('ovBtns').innerHTML = `<button class="btn go pulse" id="ovGo" aria-label="Next"><span data-icon="play"></span></button>` + (complete ? `<button class="btn mid" id="ovShelf" aria-label="Teddy shelf"><span data-icon="shelf"></span></button>` : '');
  icons($('ovBtns'));
  later(() => Snd.pop(), 120);
  const teddy = $('ovTeddy').querySelector('svg.teddy');
  if (complete){
    later(() => {
      FX.burst(160); Snd.happy(); teddy.classList.add('cheer');
      Voice.say(m === 'up' ? `Hooray! You made ${t.name}!` : `Hooray! ${t.name} got a gold star!`);
    }, 750);
  } else later(() => Voice.say(PRAISE[rand(PRAISE.length)]), 500);
  $('ovGo').addEventListener('click', () => {
    Snd.tap(); ov.hidden = true;
    if (!complete){ sess.stage = n; runStage(); return; }
    if (quizDue(m)){ startQuiz(m); return; }
    afterLetter(m);
  });
  if (complete) $('ovShelf').addEventListener('click', () => { Snd.tap(); show('shelf'); });
}

function afterLetter(m){
  if (m === 'up' && allDone('up') && !S.loIntro){
    S.loIntro = true; S.mode = 'lo'; save();
    Voice.say("You know all the big letters! Now let's learn the little letters!", () => play());
    return;
  }
  play();
}

function play(){
  let m = S.mode;
  if (m === 'lo' && !allDone('up') && !S.loOpen) m = S.mode = 'up';
  if (quizDue(m)){ startQuiz(m); return; }
  const L = nextLetter(m);
  if (L) startLetter(m, L, false);
  else startLetter(m, ORDER[m][rand(26)], true);   // everything done: practice any letter
}

  }).join('');

      b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); Snd.soft();

  }));
}

    <h3>Reset</h3>

    } else { resetArmed = Date.now(); b.textContent = 'Tap again to reset everything'; b.classList.add('armed'); }
  });
}

// Idle helper: after 10 s without a touch, Teddy gives a gentle hint (up to 3 times)
let lastTouch = Date.now(), hintN = 0;

  Snd.init(); Voice.prime(); Music.start();
}, true);
setInterval(() => {

  if (!$('ov').hidden){ const g = $('ovGo'); if (g){ g.classList.remove('pulse'); void g.offsetWidth; g.classList.add('pulse'); } Voice.say('Tap the green button!'); return; }
  if (screen === 'home'){ const p = $('playBtn'); p.classList.remove('wiggle'); void p.offsetWidth; p.classList.add('wiggle'); Voice.say("Let's play! Tap the green button!"); }
  else if (screen === 'letter' && sess && sess.hint) sess.hint(n);
  else if (screen === 'shelf') Voice.say(n === 0 ? 'Tap a teddy to say hello!' : 'Tap the green button to play!');
}, 500);

// No zoom, no scrolling (except the shelf and grown-ups lists), no callouts
document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive:false });
['gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ Music.stop(); Voice.stop(); }
  else if (Snd.ctx){ Snd.init(); Music.start(); }
});
let rsz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rsz); rsz = requestAnimationFrame(() => Ink.resize()); });

show('home');
</script>
</body>
</html>
